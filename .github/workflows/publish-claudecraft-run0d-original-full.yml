name: Publish HIGHFLY ClaudeCraft RUN0D Original Full

on:
  workflow_run:
    workflows:
      - "HIGHFLY ClaudeCraft Bridge Run0D Original Full"
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: highfly-claudecraft-run0d-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish verified RUN0D Original Full
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download exact successful RUN0D artifact
        uses: actions/download-artifact@v4
        with:
          name: highfly-claudecraft-run0d-original-full-webgl
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify exact original-full WebGL
        shell: bash
        run: |
          set -euxo pipefail
          test -f site/index.html
          test -d site/Build
          test -f site/CLAUDE_RUN0D_BUILD.txt
          grep -q "ORIGINAL FULL FIVE SKILLS" site/CLAUDE_RUN0D_BUILD.txt
          grep -q "HEROIC LEAP APPROVED RUN0B UNCHANGED" site/CLAUDE_RUN0D_BUILD.txt
          grep -q "NO GAP CLOSE" site/CLAUDE_RUN0D_BUILD.txt
          grep -q "NO TELEPORT" site/CLAUDE_RUN0D_BUILD.txt
          grep -q "ATTACK TIMESCALE 1.3" site/CLAUDE_RUN0D_BUILD.txt
          grep -q "PROCEDURAL 8X8 FLIPBOOKS" site/CLAUDE_RUN0D_BUILD.txt
          grep -q "SKILL4 BASE 7ebd380c FROZEN" site/CLAUDE_RUN0D_BUILD.txt
          test -n "$(find site/Build -maxdepth 1 -type f -name '*.wasm*' -size +0c -print -quit)"
          test -n "$(find site/Build -maxdepth 1 -type f -name '*.js*' -size +0c -print -quit)"
          touch site/.nojekyll
          du -sh site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy RUN0D to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
