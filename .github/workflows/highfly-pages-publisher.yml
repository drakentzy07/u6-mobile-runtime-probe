name: HIGHFLY Pages Publisher
# refresh bridges fusion2b
# republish: melee-fusion2b private-run-36272250830
# republish: melee-fusion2 private-run-36267369905
# republish: melee-fusion private-run-36262118568
# republish: skills 5a86eef37eb875689f52db217300cf58fd53a8ac
# republish: skills 4861a9bdb45063f08465623966a888b56af9a625
# republish: skills 64a2dd8062d03a4e628f39f1ce679b29012e2d96
# republish: skills 3e6e5f585475632d7fbeedff4320537ed2bbe02f
# republish: skills 0ae9a4d66340cc00a1c8aca2bcef3dc3b50efda0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/highfly-pages-publisher.yml"
  workflow_run:
    workflows:
      - "HIGHFLY Run0I.3 Single Hunter Guard Core"
      - "HIGHFLY SKILL4 KayKit Weapon Foundation"
      - "Build + Publish HIGHFLY Loot Monster Lab Run0A"
    types:
      - completed

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: highfly-pages-publisher
  cancel-in-progress: true

jobs:
  publish:
    name: Assemble and deploy canonical HIGHFLY Labs
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Resolve latest successful lab runs
        id: runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          SKILLS_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=highfly/skill4-kaykit-weapon-foundation&status=success&per_page=50"             --jq '.workflow_runs[] | select(.name=="HIGHFLY SKILL4 KayKit Weapon Foundation") | .id' | head -n1)"
          LOOT_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=highfly/loot-monster-lab-run0a&status=success&per_page=50"             --jq '.workflow_runs[] | select(.name=="Build + Publish HIGHFLY Loot Monster Lab Run0A") | .id' | head -n1)"
          SIDEKICK3_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=highfly/skill3-sidekick126-fix&status=success&per_page=50"             --jq '.workflow_runs[] | select(.name=="HIGHFLY Run0I.3 Single Hunter Guard Core") | .id' | head -n1)"

          test -n "$SKILLS_RUN"
          test -n "$LOOT_RUN"
          test -n "$SIDEKICK3_RUN"

          echo "skills_run=$SKILLS_RUN" >> "$GITHUB_OUTPUT"
          echo "loot_run=$LOOT_RUN" >> "$GITHUB_OUTPUT"
          echo "sidekick3_run=$SIDEKICK3_RUN" >> "$GITHUB_OUTPUT"
          echo "Skills source run: $SKILLS_RUN"
          echo "Loot source run: $LOOT_RUN"
          echo "Skill3 Sidekick source run: $SIDEKICK3_RUN"

      - name: Download canonical Skills artifact
        uses: actions/download-artifact@v4
        with:
          name: highfly-run0i3-webgl
          path: incoming/skills
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.runs.outputs.skills_run }}

      - name: Download SKILL3 Sidekick 1.2.6 artifact
        uses: actions/download-artifact@v4
        with:
          name: highfly-run0i3-webgl
          path: incoming/skill3-sidekick126
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.runs.outputs.sidekick3_run }}

      - name: Download canonical Loot artifact
        uses: actions/download-artifact@v4
        with:
          name: highfly-loot-run0a-webgl
          path: incoming/loot
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.runs.outputs.loot_run }}

      - name: Preserve existing MELEE FUSION lab
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf incoming/melee-fusion
          mkdir -p incoming
          wget --quiet --recursive --no-parent --no-host-directories --cut-dirs=1             --directory-prefix=incoming --execute robots=off             "https://drakentzy07.github.io/u6-mobile-runtime-probe/melee-fusion/"
          test -f incoming/melee-fusion/index.html
          test -f incoming/melee-fusion/RUN0I3_BUILD.txt
          test -d incoming/melee-fusion/Build
          grep -q "MELEE FUSION" incoming/melee-fusion/RUN0I3_BUILD.txt

      - name: Preserve existing MELEE FUSION 2 lab
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf incoming/melee-fusion2
          mkdir -p incoming
          wget --quiet --recursive --no-parent --no-host-directories --cut-dirs=1             --directory-prefix=incoming --execute robots=off             "https://drakentzy07.github.io/u6-mobile-runtime-probe/melee-fusion2/"
          test -f incoming/melee-fusion2/index.html
          test -f incoming/melee-fusion2/RUN0I3_BUILD.txt
          test -d incoming/melee-fusion2/Build
          grep -q "MELEE FUSION 2" incoming/melee-fusion2/RUN0I3_BUILD.txt

      - name: Preserve existing MELEE FUSION 2B lab
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf incoming/melee-fusion2b
          mkdir -p incoming
          wget --quiet --recursive --no-parent --no-host-directories --cut-dirs=1             --directory-prefix=incoming --execute robots=off             "https://drakentzy07.github.io/u6-mobile-runtime-probe/melee-fusion2b/"
          test -f incoming/melee-fusion2b/index.html
          test -f incoming/melee-fusion2b/RUN0I3_BUILD.txt
          test -d incoming/melee-fusion2b/Build
          grep -q "MELEE FUSION 2B" incoming/melee-fusion2b/RUN0I3_BUILD.txt

      - name: Assemble canonical site
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf site
          mkdir -p site/loot-monster-lab-run0a site/melee-fusion site/melee-fusion2 site/melee-fusion2b site/skill3-sidekick126

          test -f incoming/skills/index.html
          test -f incoming/skills/RUN0I3_BUILD.txt
          test -d incoming/skills/Build

          test -f incoming/loot/index.html
          test -f incoming/loot/RUN0A_BUILD.txt
          test -d incoming/loot/Build

          test -f incoming/skill3-sidekick126/index.html
          test -f incoming/skill3-sidekick126/RUN0I3_BUILD.txt
          test -d incoming/skill3-sidekick126/Build
          grep -q "SIDEKICK 1.2.6 MATERIAL FIX" incoming/skill3-sidekick126/RUN0I3_BUILD.txt

          cp -a incoming/skills/. site/
          cp -a incoming/loot/. site/loot-monster-lab-run0a/
          cp -a incoming/melee-fusion/. site/melee-fusion/
          cp -a incoming/melee-fusion2/. site/melee-fusion2/
          cp -a incoming/melee-fusion2b/. site/melee-fusion2b/
          cp -a incoming/skill3-sidekick126/. site/skill3-sidekick126/
          touch site/.nojekyll

      - name: Validate publisher invariants
        shell: bash
        run: |
          set -euxo pipefail

          test -f site/index.html
          test -f site/RUN0I3_BUILD.txt
          grep -q "KAYKIT WEAPON FOUNDATION" site/RUN0I3_BUILD.txt
          grep -q "PRIDE SPEAR RAW FBX" site/RUN0I3_BUILD.txt
          grep -q "DUAL AXE CLASSIC 1-2-3 SPIN" site/RUN0I3_BUILD.txt
          grep -q "SHIELD BASH LUNGE" site/RUN0I3_BUILD.txt

          test -f site/loot-monster-lab-run0a/index.html
          test -f site/loot-monster-lab-run0a/RUN0A_BUILD.txt
          grep -q "HIGHFLY_LOOT_MONSTER_LAB_RUN0A=1" site/loot-monster-lab-run0a/RUN0A_BUILD.txt

          test -d site/Build
          test -d site/loot-monster-lab-run0a/Build

          test -f site/melee-fusion/index.html
          test -f site/melee-fusion/RUN0I3_BUILD.txt
          grep -q "MELEE FUSION" site/melee-fusion/RUN0I3_BUILD.txt
          test -d site/melee-fusion/Build

          test -f site/melee-fusion2/index.html
          test -f site/melee-fusion2/RUN0I3_BUILD.txt
          grep -q "MELEE FUSION 2" site/melee-fusion2/RUN0I3_BUILD.txt
          test -d site/melee-fusion2/Build

          test -f site/melee-fusion2b/index.html
          test -f site/melee-fusion2b/RUN0I3_BUILD.txt
          grep -q "MELEE FUSION 2B" site/melee-fusion2b/RUN0I3_BUILD.txt
          test -d site/melee-fusion2b/Build

          test -f site/skill3-sidekick126/index.html
          test -f site/skill3-sidekick126/RUN0I3_BUILD.txt
          grep -q "SIDEKICK 1.2.6 MATERIAL FIX" site/skill3-sidekick126/RUN0I3_BUILD.txt
          test -d site/skill3-sidekick126/Build

          echo "HIGHFLY_PUBLISHER_OK=1" > site/PUBLISHER.txt
          echo "SKILLS_RUN=${{ steps.runs.outputs.skills_run }}" >> site/PUBLISHER.txt
          echo "LOOT_RUN=${{ steps.runs.outputs.loot_run }}" >> site/PUBLISHER.txt
          echo "SKILL3_SIDEKICK126_RUN=${{ steps.runs.outputs.sidekick3_run }}" >> site/PUBLISHER.txt
          echo "MELEE_FUSION_RUN=36262118568" >> site/PUBLISHER.txt
          echo "MELEE_FUSION2_RUN=36267369905" >> site/PUBLISHER.txt
          echo "MELEE_FUSION2B_RUN=36272250830" >> site/PUBLISHER.txt
          du -sh site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload canonical Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy canonical HIGHFLY Pages
        id: deployment
        uses: actions/deploy-pages@v4
