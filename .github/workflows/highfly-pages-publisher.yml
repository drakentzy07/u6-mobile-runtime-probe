name: HIGHFLY Pages Publisher
# skin-factory-source: c72696fd73b0fd2a2375790586d73ea680f19947
# refresh SKILL4 hunter-base publish
# republish: melee-fusion2b private-run-36272250830
# republish: melee-fusion2 private-run-36267369905
# republish: melee-fusion private-run-36262118568
# republish: skills 5a86eef37eb875689f52db217300cf58fd53a8ac
# republish: skills 4861a9bdb45063f08465623966a888b56af9a625
# republish: skills 64a2dd8062d03a4e628f39f1ce679b29012e2d96
# republish: skills 3e6e5f585475632d7fbeedff4320537ed2bbe02f
# republish: skills 0ae9a4d66340cc00a1c8aca2bcef3dc3b50efda0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/highfly-pages-publisher.yml"
  workflow_run:
    workflows:
      - "HIGHFLY Run0I.3 Single Hunter Guard Core"
      - "HIGHFLY SKILL4 KayKit Weapon Foundation"
      - "Build + Publish HIGHFLY Loot Monster Lab Run0A"
    types:
      - completed

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: highfly-pages-publisher
  cancel-in-progress: true

jobs:
  publish:
    name: Assemble and deploy canonical HIGHFLY Labs
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout gated HIGHFLY Skin Factory
        uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: c72696fd73b0fd2a2375790586d73ea680f19947
          path: skin-factory-source
          sparse-checkout: |
            skinlab-v2
            scripts/skin_lab
          sparse-checkout-cone-mode: true

      - name: Materialize native Skin Factory assets
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C skin-factory-source rev-parse HEAD)" = "c72696fd73b0fd2a2375790586d73ea680f19947"
          test -s skin-factory-source/skinlab-v2/index.html
          test -s skin-factory-source/skinlab-v2/modular-factory.html
          test -s skin-factory-source/skinlab-v2/donors/audits.json
          test -s skin-factory-source/scripts/skin_lab/extract_bind_reference.mjs

          rm -rf incoming/skin-factory /tmp/highfly-skin-bind
          mkdir -p incoming/skin-factory/assets/bind /tmp/highfly-skin-bind
          cp -a skin-factory-source/skinlab-v2/. incoming/skin-factory/

          BASE="https://raw.githubusercontent.com/levy-street/world-of-claudecraft/9b57e49c9676d75962700f828cc00a50a9a988b5/public"
          curl -fsSL "$BASE/models/chars/modular/warrior_modular.glb" -o incoming/skin-factory/assets/warrior_modular.glb
          curl -fsSL "$BASE/models/chars/npc_gear/harbormaster_tricorne.glb" -o incoming/skin-factory/assets/harbormaster_tricorne.glb
          curl -fsSL "$BASE/models/chars/npc_gear/harbormaster_spyglass.glb" -o incoming/skin-factory/assets/harbormaster_spyglass.glb

          test "$(stat -c%s incoming/skin-factory/assets/warrior_modular.glb)" = "3477500"
          test "$(git hash-object incoming/skin-factory/assets/warrior_modular.glb)" = "e3fb52b8e064ab3927f3bc34a5ba7d04e8d701c2"
          test "$(stat -c%s incoming/skin-factory/assets/harbormaster_tricorne.glb)" = "40512"
          test "$(sha256sum incoming/skin-factory/assets/harbormaster_tricorne.glb | cut -d' ' -f1)" = "c02cc2676b5ec85cc050a3a9cb044760b670b8f5040b35caa252f841536acba5"
          test "$(stat -c%s incoming/skin-factory/assets/harbormaster_spyglass.glb)" = "11024"
          test "$(sha256sum incoming/skin-factory/assets/harbormaster_spyglass.glb | cut -d' ' -f1)" = "74aa429a1aed82725ab54ce8c9409f67075b213698b5277bc38c8fdc8e4f8df7"

          cp skin-factory-source/scripts/skin_lab/extract_bind_reference.mjs /tmp/highfly-skin-bind/extract_bind_reference.mjs
          (
            cd /tmp/highfly-skin-bind
            npm init -y >/dev/null 2>&1
            npm install @gltf-transform/core @gltf-transform/extensions @gltf-transform/functions meshoptimizer --no-save >/dev/null
            node extract_bind_reference.mjs               --src "$GITHUB_WORKSPACE/incoming/skin-factory/assets/warrior_modular.glb"               --out "$GITHUB_WORKSPACE/incoming/skin-factory/assets/bind"               --list > "$GITHUB_WORKSPACE/incoming/skin-factory/assets/bind/joints.json"
            node extract_bind_reference.mjs               --src "$GITHUB_WORKSPACE/incoming/skin-factory/assets/warrior_modular.glb"               --out "$GITHUB_WORKSPACE/incoming/skin-factory/assets/bind"               --all
          )
          test -s incoming/skin-factory/assets/bind/joints.json
          test -s incoming/skin-factory/assets/bind/reference_head.glb
          test -s incoming/skin-factory/assets/bind/reference_hips.glb
          test -s incoming/skin-factory/assets/bind/reference_chest.glb
          echo "SKIN_FACTORY_NATIVE_PAYLOAD_GREEN=1"

      - name: Resolve latest successful lab runs
        id: runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          SKILLS_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=highfly/skill4-kaykit-weapon-foundation&status=success&per_page=50"             --jq '.workflow_runs[] | select(.name=="HIGHFLY SKILL4 KayKit Weapon Foundation") | .id' | head -n1)"
          LOOT_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=highfly/loot-monster-lab-run0a&status=success&per_page=50"             --jq '.workflow_runs[] | select(.name=="Build + Publish HIGHFLY Loot Monster Lab Run0A") | .id' | head -n1)"
          SIDEKICK3_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=highfly/skill3-sidekick126-fix&status=success&per_page=50"             --jq '.workflow_runs[] | select(.name=="HIGHFLY Run0I.3 Single Hunter Guard Core") | .id' | head -n1)"
          PREVIOUS_PAGES_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&status=success&per_page=50"             --jq '.workflow_runs[] | select(.name=="HIGHFLY Pages Publisher") | .id' | head -n1)"

          test -n "$SKILLS_RUN"
          test -n "$LOOT_RUN"
          test -n "$SIDEKICK3_RUN"
          test -n "$PREVIOUS_PAGES_RUN"

          echo "skills_run=$SKILLS_RUN" >> "$GITHUB_OUTPUT"
          echo "loot_run=$LOOT_RUN" >> "$GITHUB_OUTPUT"
          echo "sidekick3_run=$SIDEKICK3_RUN" >> "$GITHUB_OUTPUT"
          echo "previous_pages_run=$PREVIOUS_PAGES_RUN" >> "$GITHUB_OUTPUT"
          echo "Skills source run: $SKILLS_RUN"
          echo "Loot source run: $LOOT_RUN"
          echo "Skill3 Sidekick source run: $SIDEKICK3_RUN"
          echo "Previous Pages source run: $PREVIOUS_PAGES_RUN"

      - name: Download canonical Skills artifact
        uses: actions/download-artifact@v4
        with:
          name: highfly-run0i3-webgl
          path: incoming/skills
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.runs.outputs.skills_run }}

      - name: Download SKILL3 Sidekick 1.2.6 artifact
        uses: actions/download-artifact@v4
        with:
          name: highfly-run0i3-webgl
          path: incoming/skill3-sidekick126
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.runs.outputs.sidekick3_run }}

      - name: Download canonical Loot artifact
        uses: actions/download-artifact@v4
        with:
          name: highfly-loot-run0a-webgl
          path: incoming/loot
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.runs.outputs.loot_run }}

      - name: Download previous published HIGHFLY site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: incoming/previous-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.runs.outputs.previous_pages_run }}

      - name: Unpack previous published HIGHFLY site
        shell: bash
        run: |
          set -euxo pipefail
          test -f incoming/previous-pages/artifact.tar
          rm -rf previous-site
          mkdir -p previous-site
          tar -xf incoming/previous-pages/artifact.tar -C previous-site
          test -f previous-site/index.html
          test -d previous-site/melee-fusion
          test -d previous-site/melee-fusion2
          test -d previous-site/melee-fusion2b

      - name: Assemble canonical site
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf site
          cp -a previous-site site
          mkdir -p site/loot-monster-lab-run0a site/skill3-sidekick126

          test -f incoming/skills/index.html
          test -f incoming/skills/RUN0I3_BUILD.txt
          test -d incoming/skills/Build

          test -f incoming/loot/index.html
          test -f incoming/loot/RUN0A_BUILD.txt
          test -d incoming/loot/Build

          test -f incoming/skill3-sidekick126/index.html
          test -f incoming/skill3-sidekick126/RUN0I3_BUILD.txt
          test -d incoming/skill3-sidekick126/Build
          grep -q "SIDEKICK 1.2.6 MATERIAL FIX" incoming/skill3-sidekick126/RUN0I3_BUILD.txt

          cp -a incoming/skills/. site/
          cp -a incoming/loot/. site/loot-monster-lab-run0a/
          cp -a incoming/skill3-sidekick126/. site/skill3-sidekick126/
          rm -rf site/skin-factory
          mkdir -p site/skin-factory
          cp -a incoming/skin-factory/. site/skin-factory/
          touch site/.nojekyll

      - name: Validate publisher invariants
        shell: bash
        run: |
          set -euxo pipefail

          test -f site/index.html
          test -f site/RUN0I3_BUILD.txt
          grep -q "KAYKIT WEAPON FOUNDATION" site/RUN0I3_BUILD.txt
          grep -q "HUNTER BASE ROGUE HOODED" site/RUN0I3_BUILD.txt
          grep -q "SKIN PROP CLEANUP" site/RUN0I3_BUILD.txt
          grep -q "KAYKIT FANTASY GRIP ORIGIN" site/RUN0I3_BUILD.txt
          grep -q "ALL MELEE CLASSIC 1-2-3 SPIN" site/RUN0I3_BUILD.txt
          grep -q "SHIELD ATK-ATK-HEAVY SHOVE" site/RUN0I3_BUILD.txt
          grep -q "SPEAR THRUST-SWEEP-THRUST" site/RUN0I3_BUILD.txt
          grep -q "NORMALIZED BASIC SPEED" site/RUN0I3_BUILD.txt

          test -f site/loot-monster-lab-run0a/index.html
          test -f site/loot-monster-lab-run0a/RUN0A_BUILD.txt
          grep -q "HIGHFLY_LOOT_MONSTER_LAB_RUN0A=1" site/loot-monster-lab-run0a/RUN0A_BUILD.txt

          test -d site/Build
          test -d site/loot-monster-lab-run0a/Build

          test -f site/melee-fusion/index.html
          test -f site/melee-fusion/RUN0I3_BUILD.txt
          grep -q "MELEE FUSION" site/melee-fusion/RUN0I3_BUILD.txt
          test -d site/melee-fusion/Build

          test -f site/melee-fusion2/index.html
          test -f site/melee-fusion2/RUN0I3_BUILD.txt
          grep -q "MELEE FUSION 2" site/melee-fusion2/RUN0I3_BUILD.txt
          test -d site/melee-fusion2/Build

          test -f site/melee-fusion2b/index.html
          test -f site/melee-fusion2b/RUN0I3_BUILD.txt
          grep -q "MELEE FUSION 2B" site/melee-fusion2b/RUN0I3_BUILD.txt
          test -d site/melee-fusion2b/Build

          test -f site/skill3-sidekick126/index.html
          test -f site/skill3-sidekick126/RUN0I3_BUILD.txt
          grep -q "SIDEKICK 1.2.6 MATERIAL FIX" site/skill3-sidekick126/RUN0I3_BUILD.txt
          test -d site/skill3-sidekick126/Build

          test -f site/skin-factory/index.html
          test -f site/skin-factory/modular-factory.html
          test -f site/skin-factory/donors/audits.json
          test -f site/skin-factory/assets/warrior_modular.glb
          test -f site/skin-factory/assets/harbormaster_tricorne.glb
          test -f site/skin-factory/assets/harbormaster_spyglass.glb
          test -f site/skin-factory/assets/bind/joints.json
          test -f site/skin-factory/assets/bind/reference_head.glb
          test -f site/skin-factory/assets/bind/reference_hips.glb
          grep -F "<title>HIGHFLY · SKIN FACTORY</title>" site/skin-factory/index.html
          grep -F "WEARABLE / BONE ATTACH LAB" site/skin-factory/index.html
          grep -F "DONOR INSPECTOR" site/skin-factory/index.html
          grep -F '"head"' site/skin-factory/assets/bind/joints.json
          grep -F '"hips"' site/skin-factory/assets/bind/joints.json

          echo "HIGHFLY_PUBLISHER_OK=1" > site/PUBLISHER.txt
          echo "SKILLS_RUN=${{ steps.runs.outputs.skills_run }}" >> site/PUBLISHER.txt
          echo "LOOT_RUN=${{ steps.runs.outputs.loot_run }}" >> site/PUBLISHER.txt
          echo "SKILL3_SIDEKICK126_RUN=${{ steps.runs.outputs.sidekick3_run }}" >> site/PUBLISHER.txt
          echo "PREVIOUS_PAGES_RUN=${{ steps.runs.outputs.previous_pages_run }}" >> site/PUBLISHER.txt
          echo "LEGACY_LABS_PRESERVED_FROM_PREVIOUS_SITE=1" >> site/PUBLISHER.txt
          echo "SKIN_FACTORY_SOURCE=c72696fd73b0fd2a2375790586d73ea680f19947" >> site/PUBLISHER.txt
          echo "SKIN_FACTORY_PATH=/skin-factory/" >> site/PUBLISHER.txt
          echo "SKIN_FACTORY_NATIVE_WEARABLES=1" >> site/PUBLISHER.txt
          du -sh site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload canonical Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy canonical HIGHFLY Pages
        id: deployment
        uses: actions/deploy-pages@v4
