name: Publish HIGHFLY ClaudeCraft RUN0C Five Skills

on:
  workflow_run:
    workflows:
      - "HIGHFLY ClaudeCraft Bridge Run0C Five Skills"
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: highfly-claudecraft-run0c-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish verified RUN0C Five Skills
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download exact successful RUN0C artifact
        uses: actions/download-artifact@v4
        with:
          name: highfly-claudecraft-run0c-five-skills-webgl
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify exact five-skill WebGL
        shell: bash
        run: |
          set -euxo pipefail
          test -f site/index.html
          test -d site/Build
          test -f site/CLAUDE_RUN0C_BUILD.txt
          grep -q "FIVE SKILLS TOGETHER" site/CLAUDE_RUN0C_BUILD.txt
          grep -q "HEROIC_LEAP APPROVED RUN0B" site/CLAUDE_RUN0C_BUILD.txt
          grep -q "AMBUSH" site/CLAUDE_RUN0C_BUILD.txt
          grep -q "BACKSTAB" site/CLAUDE_RUN0C_BUILD.txt
          grep -q "EVISCERATE" site/CLAUDE_RUN0C_BUILD.txt
          grep -q "PUMMEL" site/CLAUDE_RUN0C_BUILD.txt
          grep -q "KEYS 1-5" site/CLAUDE_RUN0C_BUILD.txt
          grep -q "SKILL4 BASE 7ebd380c FROZEN" site/CLAUDE_RUN0C_BUILD.txt
          test -n "$(find site/Build -maxdepth 1 -type f -name '*.wasm*' -size +0c -print -quit)"
          test -n "$(find site/Build -maxdepth 1 -type f -name '*.js*' -size +0c -print -quit)"
          touch site/.nojekyll
          du -sh site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy RUN0C to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
