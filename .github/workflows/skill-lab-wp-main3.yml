name: HIGHFLY Skill Lab 2.0 Warrior Paladin MAIN3

on:
  push:
    branches: [highfly/skill-lab-2.0-wp-main3-goldbase]
    paths:
      - '.github/workflows/skill-lab-wp-main3.yml'
      - 'overlays/apply_skill_lab2_wp_main3.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: highfly-skill-lab-2-wp-main3
  cancel-in-progress: true

jobs:
  sim-authority-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Skill Lab host
        uses: actions/checkout@v4

      - name: Checkout frozen ClaudeCraft
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 9b57e49c9676d75962700f828cc00a50a9a988b5
          path: upstream

      - name: Verify frozen ClaudeCraft
        working-directory: upstream
        run: test "$(git rev-parse HEAD)" = "9b57e49c9676d75962700f828cc00a50a9a988b5"

      - name: Apply Warrior Paladin MAIN3 overlay
        working-directory: upstream
        run: |
          set -euo pipefail
          python ../overlays/apply_skill_lab2_wp_main3.py
          git diff --check
          git diff --stat

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Warrior Paladin MAIN3 authority gate
        working-directory: upstream
        run: pnpm exec vitest run tests/highfly_skill_lab2_wp_main3.test.ts

      - name: TypeScript source check
        working-directory: upstream
        run: pnpm exec tsc --project tsconfig.json --noEmit --incremental false
