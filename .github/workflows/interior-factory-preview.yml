name: Interior Factory Preview
on:
  push:
    branches:
      - highfly/ai-interior-factory-run0a
    paths:
      - 'interior_factory/web/**'
      - '.github/workflows/interior-factory-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: interior-factory-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: interior_factory/web
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
