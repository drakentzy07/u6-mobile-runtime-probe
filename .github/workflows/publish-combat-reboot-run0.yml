name: Publish HIGHFLY Skills Lab Supremo Run0F

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-combat-reboot-run0.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: highfly-skills-lab-supremo-pages
  cancel-in-progress: true

jobs:
  stage:
    name: Merge current Pages + Skills Lab Supremo Run0F
    runs-on: ubuntu-latest
    steps:
      - name: Download current combined Pages site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: current-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36028413033

      - name: Download verified Run0F Lucid Dragon KayKit Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: run0f-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36075060029

      - name: Assemble combined site
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site

          test -f current-pages/artifact.tar
          tar -xf current-pages/artifact.tar -C site

          test -f site/index.html
          test -f site/donor-lab-v25/index.html
          test -f site/donor-lab-v26/index.html
          test -f site/donor-lab-v27/index.html
          test -f site/combat-reboot-run0/index.html

          test -f run0f-pages/artifact.tar
          mkdir -p run0f
          tar -xf run0f-pages/artifact.tar -C run0f

          test -f run0f/index.html
          test -d run0f/Build
          test -n "$(find run0f/Build -maxdepth 1 -type f -name '*.wasm*' -size +0c -print -quit)"
          test -n "$(find run0f/Build -maxdepth 1 -type f -name '*.js*' -size +0c -print -quit)"

          rm -rf site/skills-lab-supremo
          mkdir -p site/skills-lab-supremo
          cp -a run0f/. site/skills-lab-supremo/

          test -f site/skills-lab-supremo/index.html
          test -d site/skills-lab-supremo/Build
          test -n "$(find site/skills-lab-supremo/Build -maxdepth 1 -type f -name '*.wasm*' -size +0c -print -quit)"
          test -n "$(find site/skills-lab-supremo/Build -maxdepth 1 -type f -name '*.js*' -size +0c -print -quit)"

          echo "HIGHFLY SKILLS LAB SUPREMO • RUN0F • LUCID + DRAGON + KAYKIT • UNITY 6000.6.2 • SOURCE RUN 36075060029 • COMMIT f780ca21988c98498249db9ae1d5887bbd663df9" > site/skills-lab-supremo/published-version.txt
          touch site/.nojekyll
          du -sh site/skills-lab-supremo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy Pages + Skills Lab Supremo Run0F
    needs: stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
