name: Publish HIGHFLY Skills Lab Supremo Run0A

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-combat-reboot-run0.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: highfly-skills-lab-supremo-pages
  cancel-in-progress: true

jobs:
  stage:
    name: Merge current Pages + Skills Lab Supremo Run0A
    runs-on: ubuntu-latest
    steps:
      - name: Download current combined Pages site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: current-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36028413033

      - name: Download verified CLEAN Run0A WebGL
        uses: actions/download-artifact@v4
        with:
          name: highfly-combat-reboot-clean-run0a-webgl
          path: clean-run0a
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36070218024

      - name: Assemble combined site
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site

          test -f current-pages/artifact.tar
          tar -xf current-pages/artifact.tar -C site

          test -f site/index.html
          test -f site/donor-lab-v25/index.html
          test -f site/donor-lab-v26/index.html
          test -f site/donor-lab-v27/index.html
          test -f site/combat-reboot-run0/index.html

          test -f clean-run0a/index.html
          test -d clean-run0a/Build
          test -n "$(find clean-run0a/Build -maxdepth 1 -type f -name '*.wasm*' -size +0c -print -quit)"
          test -n "$(find clean-run0a/Build -maxdepth 1 -type f -name '*.js*' -size +0c -print -quit)"

          rm -rf site/skills-lab-supremo
          mkdir -p site/skills-lab-supremo
          cp -a clean-run0a/. site/skills-lab-supremo/

          test -f site/skills-lab-supremo/index.html
          test -d site/skills-lab-supremo/Build
          test -n "$(find site/skills-lab-supremo/Build -maxdepth 1 -type f -name '*.wasm*' -size +0c -print -quit)"
          test -n "$(find site/skills-lab-supremo/Build -maxdepth 1 -type f -name '*.js*' -size +0c -print -quit)"

          echo "HIGHFLY SKILLS LAB SUPREMO • RUN0A CLEAN • SOURCE RUN 36070218024 • COMMIT 139559282d2a90252026d1193f661b870a6f767d" > site/skills-lab-supremo/published-version.txt
          touch site/.nojekyll
          du -sh site/skills-lab-supremo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy Pages + Skills Lab Supremo Run0A
    needs: stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
