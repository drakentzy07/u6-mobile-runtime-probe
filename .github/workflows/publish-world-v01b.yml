name: Publish HIGHFLY World v0.1B

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-world-v01b.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: highfly-world-v01b-publish
  cancel-in-progress: true

jobs:
  stage:
    name: Merge Skill Lab v0.14 + WORLD v0.1B
    runs-on: ubuntu-latest
    steps:
      - name: Download latest Skill Lab v0.14 Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: skill-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35791212462

      - name: Download verified WORLD v0.1B Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: world-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35787916177

      - name: Build combined Pages site
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site world-source

          test -f skill-artifact/artifact.tar
          tar -xf skill-artifact/artifact.tar -C site
          test -f site/index.html

          test -f world-artifact/artifact.tar
          tar -xf world-artifact/artifact.tar -C world-source
          test -f world-source/world-v01b/index.html

          rm -rf site/world-v01b
          cp -a world-source/world-v01b site/world-v01b
          echo "HIGHFLY WORLD v0.1B - DIRECT SOMNIA + PERSISTENT SAFE ZONE" > site/world-v01b/version.txt

          test -f site/world-v01b/index.html
          test -f site/world-v01b/Build/WebGL.loader.js
          touch site/.nojekyll

          echo "Combined site ready:"
          du -sh site site/world-v01b

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy Skill Lab v0.14 + WORLD v0.1B
    needs: stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
