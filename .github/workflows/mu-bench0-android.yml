name: HIGHFLY MU-BENCH 0 Android

on:
  push:
    branches:
      - highfly/mu-bench0-real-android
    paths:
      - "mu-bench0/**"
      - ".github/workflows/mu-bench0-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout HIGHFLY benchmark harness
        uses: actions/checkout@v4

      - name: Checkout pinned MU client
        run: |
          git clone https://github.com/bernatvadell/muonline.git muonline
          cd muonline
          git checkout 7baa3454b890c1b33189fd2bc89c7f6d7af3058d
          git status --short
          git rev-parse HEAD

      - name: Apply MU-BENCH 0 patch
        run: |
          python3 mu-bench0/patch.py
          grep -R "MU-BENCH 0" -n muonline/Client.Main muonline/MuAndroid | head -30

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        run: |
          dotnet --info
          dotnet workload install android
          dotnet workload list

      - name: Restore Android project
        working-directory: muonline
        run: dotnet restore ./MuAndroid/MuAndroid.csproj

      - name: Build installable Android APK
        working-directory: muonline
        run: |
          dotnet build ./MuAndroid/MuAndroid.csproj \
            -f net10.0-android \
            -c Debug \
            -p:AndroidPackageFormat=apk \
            -p:AcceptAndroidSDKLicenses=true

      - name: Collect APK
        run: |
          mkdir -p out
          echo "APK candidates:"
          find muonline/MuAndroid/bin -type f -name "*.apk" -print || true

          APK="$(find muonline/MuAndroid/bin -type f -name "*-Signed.apk" | head -1)"
          if [ -z "$APK" ]; then
            APK="$(find muonline/MuAndroid/bin -type f -name "*.apk" | head -1)"
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK produced"
            exit 1
          fi

          cp "$APK" out/HIGHFLY-MU-BENCH0.apk
          sha256sum out/HIGHFLY-MU-BENCH0.apk | tee out/SHA256.txt
          ls -lh out/

      - name: Upload playable APK
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-MU-BENCH0-ANDROID
          path: |
            out/HIGHFLY-MU-BENCH0.apk
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 14
