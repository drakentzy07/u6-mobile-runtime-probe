name: HIGHFLY Skin Factory Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/skin-factory-pages.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: highfly-skin-factory-pages
  cancel-in-progress: true

env:
  SKIN_FACTORY_SOURCE_SHA: "cd6d60c7e445534b5425e6e84192b07aa9ac4ee9"
  CREATOR_LAB_SOURCE_SHA: "3945cbec93a8dbfe69e92b5e49613edadc4ed771"
  CURRENT_SKILL_LAB_RUN: "37238315353"

jobs:
  publish:
    name: Build isolated Skin Factory site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout gated Skin Factory source
        uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: ${{ env.SKIN_FACTORY_SOURCE_SHA }}
          path: skin-factory-source
          sparse-checkout: |
            skinlab-v2
            scripts/skin_lab
          sparse-checkout-cone-mode: true

      - name: Checkout GREEN Creator Lab source separately
        uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: ${{ env.CREATOR_LAB_SOURCE_SHA }}
          path: creator-lab-source
          sparse-checkout: |
            creator-lab
          sparse-checkout-cone-mode: true

      - name: Download current Skill Lab site as host base
        uses: actions/download-artifact@v4
        with:
          name: current-skill-lab-webgl
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: drakentzy07/u6-mobile-runtime-probe
          run-id: ${{ env.CURRENT_SKILL_LAB_RUN }}

      - name: Build Skin Factory payload
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C skin-factory-source rev-parse HEAD)" = "$SKIN_FACTORY_SOURCE_SHA"
          test -s site/index.html
          rm -rf site/skin-factory /tmp/highfly-skin-bind
          mkdir -p site/skin-factory/assets/bind /tmp/highfly-skin-bind
          cp -a skin-factory-source/skinlab-v2/. site/skin-factory/

          BASE="https://raw.githubusercontent.com/levy-street/world-of-claudecraft/9b57e49c9676d75962700f828cc00a50a9a988b5/public"
          curl -fsSL "$BASE/models/chars/modular/warrior_modular.glb" -o site/skin-factory/assets/warrior_modular.glb
          curl -fsSL "$BASE/models/chars/npc_gear/harbormaster_tricorne.glb" -o site/skin-factory/assets/harbormaster_tricorne.glb
          curl -fsSL "$BASE/models/chars/npc_gear/harbormaster_spyglass.glb" -o site/skin-factory/assets/harbormaster_spyglass.glb

          test "$(stat -c%s site/skin-factory/assets/warrior_modular.glb)" = "3477500"
          test "$(git hash-object site/skin-factory/assets/warrior_modular.glb)" = "e3fb52b8e064ab3927f3bc34a5ba7d04e8d701c2"
          test "$(stat -c%s site/skin-factory/assets/harbormaster_tricorne.glb)" = "40512"
          test "$(sha256sum site/skin-factory/assets/harbormaster_tricorne.glb | cut -d' ' -f1)" = "c02cc2676b5ec85cc050a3a9cb044760b670b8f5040b35caa252f841536acba5"
          test "$(stat -c%s site/skin-factory/assets/harbormaster_spyglass.glb)" = "11024"
          test "$(sha256sum site/skin-factory/assets/harbormaster_spyglass.glb | cut -d' ' -f1)" = "74aa429a1aed82725ab54ce8c9409f67075b213698b5277bc38c8fdc8e4f8df7"

          cp skin-factory-source/scripts/skin_lab/extract_bind_reference.mjs /tmp/highfly-skin-bind/extract_bind_reference.mjs
          (
            cd /tmp/highfly-skin-bind
            npm init -y >/dev/null 2>&1
            npm install @gltf-transform/core @gltf-transform/extensions @gltf-transform/functions meshoptimizer --no-save >/dev/null
            node extract_bind_reference.mjs               --src "$GITHUB_WORKSPACE/site/skin-factory/assets/warrior_modular.glb"               --out "$GITHUB_WORKSPACE/site/skin-factory/assets/bind"               --list > "$GITHUB_WORKSPACE/site/skin-factory/assets/bind/joints.json"
            node extract_bind_reference.mjs               --src "$GITHUB_WORKSPACE/site/skin-factory/assets/warrior_modular.glb"               --out "$GITHUB_WORKSPACE/site/skin-factory/assets/bind"               --all
          )

          # ADDITIVE creator-lab payload. Existing GAME root and Skin Factory paths stay untouched.
          test "$(git -C creator-lab-source rev-parse HEAD)" = "$CREATOR_LAB_SOURCE_SHA"
          rm -rf site/creator-lab
          mkdir -p site/creator-lab/assets/bind
          cp -a creator-lab-source/creator-lab/. site/creator-lab/
          cp site/skin-factory/assets/warrior_modular.glb site/creator-lab/assets/warrior_modular.glb
          cp site/skin-factory/assets/bind/reference_head.glb site/creator-lab/assets/bind/reference_head.glb
          cp site/skin-factory/assets/bind/joints.json site/creator-lab/assets/bind/joints.json
          test -s site/creator-lab/index.html
          test -s site/creator-lab/creator.mjs
          test -s site/creator-lab/geometry.mjs
          test -s site/creator-lab/assets/bind/reference_head.glb
          test "$(git hash-object site/creator-lab/assets/warrior_modular.glb)" = "e3fb52b8e064ab3927f3bc34a5ba7d04e8d701c2"
          grep -F "<title>HIGHFLY · CREATOR LAB</title>" site/creator-lab/index.html
          echo "CREATOR_LAB_ISOLATED_PAGES_GREEN=1"

          test -s site/skin-factory/index.html
          test -s site/skin-factory/modular-factory.html
          test -s site/skin-factory/donors/audits.json
          test -s site/skin-factory/assets/bind/joints.json
          test -s site/skin-factory/assets/bind/reference_head.glb
          test -s site/skin-factory/assets/bind/reference_hips.glb
          grep -F "<title>HIGHFLY · SKIN FACTORY</title>" site/skin-factory/index.html
          grep -F "ACCESORIOS / ANCLAJE A HUESO" site/skin-factory/index.html
          touch site/.nojekyll
          echo "SKIN_FACTORY_ISOLATED_PAGES_GREEN=1"


      - name: Forge genuine Blender GLB for isolated Creator Lab (no apt)
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          VERSION="4.2.23"
          NAME="blender-${VERSION}-linux-x64.tar.xz"
          BASE="https://download.blender.org/release/Blender4.2"
          mkdir -p "$RUNNER_TEMP/highfly-blender" "$RUNNER_TEMP/highfly-blender-archive"
          cd "$RUNNER_TEMP/highfly-blender-archive"
          curl --fail --show-error --location --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 390 "$BASE/$NAME" -o "$NAME"
          curl --fail --show-error --location --retry 2 --connect-timeout 15 --max-time 35 "$BASE/blender-${VERSION}.sha256" -o SHA256SUMS
          grep -F "$NAME" SHA256SUMS | head -n 1 | sha256sum --check
          tar -xJf "$NAME" --strip-components=1 -C "$RUNNER_TEMP/highfly-blender"
          cd "$GITHUB_WORKSPACE"
          test -s site/creator-lab/assets/bind/reference_head.glb
          mkdir -p site/creator-lab/assets/blender
          "$RUNNER_TEMP/highfly-blender/blender" --background --factory-startup \
            --python creator-lab-source/creator-lab/blender/headless_forge.py -- \
            --native site/creator-lab/assets/bind/reference_head.glb \
            --out site/creator-lab/assets/blender/highfly-blender-forge.glb
          test -s site/creator-lab/assets/blender/highfly-blender-forge.glb
          test -s site/creator-lab/assets/blender/highfly-blender-forge.json
          node - <<'JS'
          const fs=require('fs');
          const proof=JSON.parse(fs.readFileSync('site/creator-lab/assets/blender/highfly-blender-forge.json','utf8'));
          if(proof.native_reference!=='M_Head'||proof.geometry_objects!==7||
            !proof.gltf_y_up_export||!proof.bezier_curves_converted||
            proof.roundtrip_world_space_error>0.001||proof.glb_bytes<1000)
            throw Error('Blender forge production check failed '+JSON.stringify(proof));
          console.log('PAGES_BLENDER_NATIVE_GLTF_Y_UP_GREEN=1');
          JS

      - name: Validate published Blender GLB using Khronos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gltf-validate"
          npm install --prefix "$RUNNER_TEMP/gltf-validate" --no-save --silent gltf-validator
          node - <<'JS'
          const fs=require('fs'),path=require('path');
          const validator=require(path.join(process.env.RUNNER_TEMP,'gltf-validate/node_modules/gltf-validator'));
          (async()=>{
            const file='site/creator-lab/assets/blender/highfly-blender-forge.glb';
            const bytes=fs.readFileSync(file);
            const v=await validator.validateBytes(new Uint8Array(bytes),{uri:'highfly-blender-forge.glb',maxIssues:50});
            if(v.issues.numErrors!==0)throw Error('Production GLB invalid: '+JSON.stringify(v.issues.messages.slice(0,5)));
            console.log('PAGES_CREATOR_BLENDER_GLTF_VALID_GREEN='+bytes.length+' warnings='+v.issues.numWarnings);
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Skin Factory
        id: deployment
        uses: actions/deploy-pages@v4
