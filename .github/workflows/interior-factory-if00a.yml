name: Interior Factory IF-00A
on:
  pull_request:
    paths:
      - 'interior_factory/**'
      - '.github/workflows/interior-factory-if00a.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate InteriorSpec
        run: node interior_factory/src/validate-spec.mjs
      - name: Regenerate approved layout
        run: node interior_factory/src/generate-smithy.mjs > /tmp/IF-00A-layout.json
      - name: Compare deterministic output semantically
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const approved=JSON.parse(fs.readFileSync('interior_factory/runs/IF-00A-layout.json','utf8'));
          const generated=JSON.parse(fs.readFileSync('/tmp/IF-00A-layout.json','utf8'));
          if(JSON.stringify(approved)!==JSON.stringify(generated)){console.error('Generated layout differs from approved semantic JSON');process.exit(1)}
          console.log('Semantic layout match: PASS');
          NODE
      - name: Syntax-check Interior Editor v21
        run: node interior_factory/src/check-html-module.mjs interior_factory/web/interior-editor-v21.html
      - name: Guard v21 editor/catalog/showroom
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('interior_factory/web/interior-editor-v21.html','utf8');
          for(const token of [
            'const DEFAULT_LAYOUT_V21=',
            'HIGHFLY_FORJA_WORKSPACE_STABLE_4',
            'MIDDLE:THREE.MOUSE.ROTATE',
            'RIGHT:THREE.MOUSE.PAN',
            'WEB-READY INSERTABLES:',
            'AUDITED_LOCAL',
            "let filter='all'",
            'SIN RESULTADOS',
            'F ENFOCAR',
            'nudgeSelected',
            'Estante 4 PREMIUM ESPADAS',
            'Estante 4 ESCUDOS',
            'Puerta doble medieval premium',
            'q_115'
          ]){if(!s.includes(token)){console.error('Missing V21 invariant:',token);process.exit(1)}}
          const m=s.match(/const DEFAULT_LAYOUT_V21=(\{.*?\});\s*async function init/s);
          if(!m){console.error('DEFAULT_LAYOUT_V21 not parseable');process.exit(1)}
          const d=JSON.parse(m[1]);
          const shelves=(d.objects||[]).filter(o=>o.category==='Vitrinas'&&/^Estante [1-4] /.test(o.name||''));
          if(shelves.length!==24){console.error('Expected 24 showcase shelves, got',shelves.length);process.exit(1)}
          const stock=(d.objects||[]).filter(o=>/STOCK FORJA/.test(o.name||''));
          if(stock.length){console.error('Old STOCK FORJA showcase survived',stock.map(x=>x.name));process.exit(1)}
          const entrance=(d.objects||[]).filter(o=>/Puerta doble medieval premium|Marco puerta doble/.test(o.name||''));
          if(entrance.length<2){console.error('Premium double entrance incomplete');process.exit(1)}
          console.log('V21 editor/catalog/showroom guards: PASS');
          NODE
