name: Interior Factory IF-00A
on:
  pull_request:
    paths:
      - 'interior_factory/**'
      - '.github/workflows/interior-factory-if00a.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate InteriorSpec
        run: node interior_factory/src/validate-spec.mjs
      - name: Regenerate approved layout
        run: node interior_factory/src/generate-smithy.mjs > /tmp/IF-00A-layout.json
      - name: Compare deterministic output semantically
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const approved=JSON.parse(fs.readFileSync('interior_factory/runs/IF-00A-layout.json','utf8'));
          const generated=JSON.parse(fs.readFileSync('/tmp/IF-00A-layout.json','utf8'));
          if(JSON.stringify(approved)!==JSON.stringify(generated)){console.error('Generated layout differs from approved semantic JSON');process.exit(1)}
          console.log('Semantic layout match: PASS');
          NODE
      - name: Syntax-check Interior Editor v22
        run: node interior_factory/src/check-html-module.mjs interior_factory/web/interior-editor-v22.html
      - name: Guard v22 catalog and showcases
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('interior_factory/web/interior-editor-v22.html','utf8');
          for(const token of [
            'const DEFAULT_LAYOUT_V22=',
            'HIGHFLY_FORJA_WORKSPACE_STABLE_5',
            "const base=(' '+String(s??'')+' ')",
            'CATÁLOGO ◀',
            'catalogCollapsed',
            'Estante diagonal 4 ESPADAS SUPREMAS',
            'Estante diagonal 4 SELECCIÓN MAESTRA',
            'Mostrador atención premium',
            'Cierre pared sobre puerta'
          ]){if(!s.includes(token)){console.error('Missing V22 invariant:',token);process.exit(1)}}

          const m=s.match(/const DEFAULT_LAYOUT_V22=(\{.*?\});\s*async function init/s);
          if(!m){console.error('DEFAULT_LAYOUT_V22 not parseable');process.exit(1)}
          const d=JSON.parse(m[1]);
          const shelves=(d.objects||[]).filter(o=>o.category==='Vitrinas'&&/^Estante diagonal [1-4] /.test(o.name||''));
          if(shelves.length!==32){console.error('Expected 32 diagonal shelves, got',shelves.length);process.exit(1)}
          const cases=(d.objects||[]).filter(o=>o.category==='Vitrinas'&&/^Vidrio vitrina /.test(o.name||''));
          if(cases.length!==8){console.error('Expected 8 showcases, got',cases.length);process.exit(1)}
          const supported=(d.objects||[]).filter(o=>o.category==='Armas'&&o.pos&&o.pos[2]<9.4&&o.pos[1]<1.8&&Number.isFinite(o.supportY));
          if(supported.length<32){console.error('Expected at least 32 supported showcase weapons, got',supported.length);process.exit(1)}
          console.log('V22 catalog/showcase guards: PASS');
          NODE
