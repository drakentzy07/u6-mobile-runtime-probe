name: Interior Factory IF-00A
on:
  pull_request:
    paths:
      - 'interior_factory/**'
      - '.github/workflows/interior-factory-if00a.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate InteriorSpec
        run: node interior_factory/src/validate-spec.mjs
      - name: Regenerate approved layout
        run: node interior_factory/src/generate-smithy.mjs > /tmp/IF-00A-layout.json
      - name: Compare deterministic output semantically
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const approved=JSON.parse(fs.readFileSync('interior_factory/runs/IF-00A-layout.json','utf8'));
          const generated=JSON.parse(fs.readFileSync('/tmp/IF-00A-layout.json','utf8'));
          if (JSON.stringify(approved)!==JSON.stringify(generated)) {
            console.error('Generated layout differs from approved semantic JSON');
            process.exit(1);
          }
          console.log('Semantic layout match: PASS');
          NODE

      - name: Syntax-check Interior Editor v15
        run: node interior_factory/src/check-html-module.mjs interior_factory/web/interior-editor-v15.html

      - name: Guard v15 early-init references
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('interior_factory/web/interior-editor-v15.html','utf8');
          const decl=s.indexOf('const UP=0,LOW=-4.2;');
          const pre=s.slice(0,decl);
          if (/zoneLight\([^\n]*\bLOW\b/.test(pre)) {
            console.error('LOW referenced before declaration in scene boot');
            process.exit(1);
          }
          console.log('Early-init reference guard: PASS');
          NODE

      - name: Guard v15 editor features
        shell: bash
        run: |
          grep -q "snapBottomToY" interior_factory/web/interior-editor-v15.html
          grep -q "constrainEditableRoot" interior_factory/web/interior-editor-v15.html
          grep -q "ramp('PREMIUM ESPADAS'" interior_factory/web/interior-editor-v15.html
          grep -q "ramp('LANZAS'" interior_factory/web/interior-editor-v15.html
          grep -q "Gran fragua" interior_factory/web/interior-editor-v15.html
          grep -q "orbit.rotateSpeed=-.38" interior_factory/web/interior-editor-v15.html
          echo "V15 feature guards: PASS"

      - name: Guard v15 showroom premium
        shell: bash
        run: |
          grep -q "ramp('PREMIUM ESPADAS'" interior_factory/web/interior-editor-v15.html
          grep -q "ramp('PREMIUM MIXTA'" interior_factory/web/interior-editor-v15.html
          grep -q "normalizedText" interior_factory/web/interior-editor-v15.html
          grep -q "nombreES" interior_factory/web/interior-editor-v15.html
          grep -q "Dintel puerta" interior_factory/web/interior-editor-v15.html
          if grep -q "\['shelf'" interior_factory/web/interior-editor-v15.html; then
            echo "WARN: shelf asset still exists in catalog/base source, checking seeded props separately"
          fi
          echo "V15 showroom premium guards: PASS"
