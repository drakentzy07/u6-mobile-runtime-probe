name: Interior Factory IF-00A
on:
  pull_request:
    paths:
      - 'interior_factory/**'
      - '.github/workflows/interior-factory-if00a.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate InteriorSpec
        run: node interior_factory/src/validate-spec.mjs
      - name: Regenerate approved layout
        run: node interior_factory/src/generate-smithy.mjs > /tmp/IF-00A-layout.json
      - name: Compare deterministic output semantically
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const approved=JSON.parse(fs.readFileSync('interior_factory/runs/IF-00A-layout.json','utf8'));
          const generated=JSON.parse(fs.readFileSync('/tmp/IF-00A-layout.json','utf8'));
          if(JSON.stringify(approved)!==JSON.stringify(generated)){
            console.error('Generated layout differs from approved semantic JSON');
            process.exit(1);
          }
          console.log('Semantic layout match: PASS');
          NODE
      - name: Syntax-check Interior Editor v19
        run: node interior_factory/src/check-html-module.mjs interior_factory/web/interior-editor-v19.html
      - name: Guard v19 supreme forge design
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('interior_factory/web/interior-editor-v19.html','utf8');
          for(const token of [
            'const DEFAULT_LAYOUT_V19=',
            'HIGHFLY_FORJA_WORKSPACE_STABLE_2',
            'Escalón 1 PREMIUM ESPADAS',
            'Escalón 3 PREMIUM ESPADAS',
            'Espada G',
            'Hacha D',
            'Daga C',
            'Escudo D',
            'Lanza B',
            'Armero decorado',
            'Piedra de afilar manual',
            'Hierro · pila grande',
            'Cobre · pila grande',
            'Plata · pila grande',
            'Oro · pila grande',
            'Yunque principal'
          ]){
            if(!s.includes(token)){console.error('Missing V19 invariant:',token);process.exit(1)}
          }
          const m=s.match(/const DEFAULT_LAYOUT_V19=(\{.*?\});\s*async function init/s);
          if(!m){console.error('DEFAULT_LAYOUT_V19 not parseable');process.exit(1)}
          const d=JSON.parse(m[1]);
          const upperMaterials=(d.objects||[]).filter(o=>o.category==='Materiales'&&o.pos&&o.pos[1]>-1&&o.name!=='Piedra de afilar manual');
          if(upperMaterials.length){
            console.error('Upper floor still contains forge materials:',upperMaterials.map(x=>x.name));
            process.exit(1);
          }
          const seededStaff=(d.objects||[]).filter(o=>/Staff/i.test(o.name||''));
          if(seededStaff.length){console.error('Staff seeded in forge:',seededStaff.map(x=>x.name));process.exit(1)}
          const ingots=(d.objects||[]).filter(o=>o.category==='Materiales'&&o.pos&&o.pos[1]<-1&&/pila/i.test(o.name||''));
          if(ingots.length<10){console.error('Not enough organized ingot stacks:',ingots.length);process.exit(1)}
          console.log('V19 supreme forge guards: PASS');
          NODE
