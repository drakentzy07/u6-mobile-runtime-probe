          done
          node ./highfly_skill_lab2_rogue_hardening_smoke.mjs

      - name: Skill Lab 2.0 Rogue PACK R2 browser smoke
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cp ../overlays/highfly_skill_lab2_rogue_pack_r2_smoke.mjs ./highfly_skill_lab2_rogue_pack_r2_smoke.mjs
          pnpm exec vite preview --host 127.0.0.1 --port 4176 --base=/u6-mobile-runtime-probe/ > ../skill-lab2-r2-preview.log 2>&1 &
