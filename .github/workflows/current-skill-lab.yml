name: HIGHFLY LABSKILL LVL20 4 Pairs 10 Slot

on:
  push:
    branches: [highfly/labskill-lvl20-10slot]
    paths:
      - ".github/workflows/current-skill-lab.yml"
      - "overlays/apply_current_skill_lab_pack01.py"
      - "overlays/highfly_current_skill_lab_smoke.mjs"
      - "overlays/apply_skill_lab2_rogue_mutation.py"
      - "overlays/highfly_skill_lab2_rogue_smoke.mjs"
      - "overlays/apply_skill_lab2_rogue_hardening.py"
      - "overlays/highfly_skill_lab2_rogue_hardening_smoke.mjs"
      - "overlays/apply_skill_lab2_rogue_pack_r2.py"
      - "overlays/highfly_skill_lab2_rogue_pack_r2_smoke.mjs"
      - "overlays/apply_skill_lab2_warlock_pack_r3.py"
      - "overlays/apply_skill_lab2_rw_poc_evil_eye.py"
      - "overlays/apply_skill_lab2_rw_r3_core_adapters.py"
      - "overlays/apply_skill_lab2_rw_r3_gold.py"
      - "overlays/highfly_skill_lab2_rw_r3_gold_smoke.mjs"
      - "overlays/apply_skill_lab2_wp_main3.py"
      - "overlays/apply_skill_lab2_wp_main3_gold.py"
      - "overlays/highfly_skill_lab2_wp_main3_gold_smoke.mjs"
      - "overlays/apply_skill_lab2_wp_execute.py"
      - "overlays/apply_skill_lab2_wp_paladin_heritage.py"
      - "overlays/apply_skill_lab2_wp_7of7_gold.py"
      - "overlays/highfly_skill_lab2_wp_7of7_gold_smoke.mjs"
      - "overlays/apply_skill_lab2_ms_pyrelance_gold.py"
      - "overlays/highfly_skill_lab2_ms_pyrelance_gold_smoke.mjs"
      - "overlays/apply_skill_lab2_ms_meteor_gold.py"
      - "overlays/highfly_skill_lab2_ms_meteor_gold_smoke.mjs"
      - "overlays/apply_skill_lab2_ms_aether_darts_gold.py"
      - "overlays/highfly_skill_lab2_ms_aether_darts_gold_smoke.mjs"
      - "overlays/apply_skill_lab2_ms_dragons_breath_gold.py"
      - "overlays/highfly_skill_lab2_ms_dragons_breath_gold_smoke.mjs"
      - "overlays/apply_skill_lab2_ms_faultwake_gold.py"
      - "overlays/highfly_skill_lab2_ms_faultwake_gold_smoke.mjs"
      - "overlays/apply_skill_lab2_ms_arc_bolt_gold.py"
      - "overlays/highfly_skill_lab2_ms_arc_bolt_gold_smoke.mjs"
      - "overlays/apply_skill_lab2_ms_shaman_heritage_bridge.py"
      - "overlays/apply_skill_lab2_ms_pack456_lab.py"
      - "overlays/apply_skill_lab2_ms_magma_burst_gold.py"
      - "overlays/highfly_skill_lab2_ms_magma_burst_gold_smoke.mjs"
      - "overlays/apply_skill_lab2_ms_pack7_lab.py"
      - "overlays/apply_skill_lab2_hd_frostjaw_gold.py"
      - "overlays/apply_skill_lab2_hd_frostjaw_lab.py"
      - "overlays/highfly_skill_lab2_hd_frostjaw_gold_smoke.mjs"
      - "overlays/apply_skill_lab2_hd_7of7_gold.py"
      - "overlays/apply_skill_lab2_hd_7of7_lab.py"
      - "overlays/highfly_skill_lab2_hd_7of7_gold_smoke.mjs"
      - "overlays/apply_highfly_labskill_lvl20_10slot.py"
      - "overlays/highfly_labskill_lvl20_10slot_smoke.mjs"
      - "src/highfly/labskill_loadouts.ts"
      - "src/highfly/labskill_runtime.ts"
      - "src/styles/hf_labskill.css"
      - "tests/highfly_labskill_lvl20_10slot.test.ts"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: highfly-labskill-lvl20-10slot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Skill Lab host
        uses: actions/checkout@v4

      - name: Checkout current HIGHFLY movement foundation
        uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: b40a9b68d1bac946976878d788cf21771cc8c0d3
          path: foundation-src

      - name: Checkout current HIGHFLY skill adapter
        uses: actions/checkout@v4
        with:
          repository: drakentzy07/cobalt-hollow-lab
          ref: 2d2458adc8c7df6edf766ea6fe0e34aaefd465f6
          path: skill-src

      - name: Checkout frozen ClaudeCraft
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 9b57e49c9676d75962700f828cc00a50a9a988b5
          path: upstream
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /tests/
            /electron/
            /scripts/
            /server/
            /headless/
            /bot/
            /data/
            /patches/
            /private/
            /public/
            /package.json
            /pnpm-lock.yaml
            /vite.config.ts
            /tsconfig.json
            /tsconfig.admin.json
            /tsconfig.bot.json
            /svelte.config.js
            /.browserslistrc
            /.npmrc
            /biome.json
            /index.html
            /admin.html
            /guide.html
            /editor.html
            /play.html
            /wallet-handoff.html

      - name: Verify frozen ClaudeCraft
        working-directory: upstream
        run: test "$(git rev-parse HEAD)" = "9b57e49c9676d75962700f828cc00a50a9a988b5"

      - name: Apply current HIGHFLY movement + camera
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          git apply ../foundation-src/overlays/pages-media-base.patch
          git apply ../foundation-src/overlays/cobalt-offline-gate.patch
          python ../foundation-src/overlays/highfly_mobile_360.py
          python ../foundation-src/overlays/highfly_mobile_analog.py
          python ../foundation-src/overlays/verify_highfly_8way.py
          python ../foundation-src/overlays/highfly_offline_save.py
          python ../foundation-src/overlays/highfly_entry_es.py
          python ../foundation-src/overlays/highfly_mobile_creator.py
          python ../foundation-src/overlays/highfly_offline_resume_preview.py
          python ../foundation-src/overlays/highfly_mobile_polish.py
          python ../foundation-src/overlays/highfly_advanced_mobility.py
          python ../foundation-src/overlays/highfly_run09_mobile_actions.py
          python ../foundation-src/overlays/highfly_run091_ui_polish.py
          python ../foundation-src/overlays/highfly_run092_hud_comfort.py
          python ../foundation-src/overlays/highfly_run093_preview_hud.py
          python ../foundation-src/overlays/highfly_run093_combat.py
          cp ../foundation-src/overlays/rewrite_source_public_paths.py ../rewrite_source_public_paths_skill_lab.py
          sed -i 's#/cobalt-hollow-lab#/u6-mobile-runtime-probe#g' ../rewrite_source_public_paths_skill_lab.py
          python ../rewrite_source_public_paths_skill_lab.py
          python -c "from pathlib import Path; p=Path('vite.config.ts'); s=p.read_text(); old=\"  base: '/',\"; new=\"  base: env(['VITE_COBALT_BASE']) ?? '/',\"; assert s.count(old)==1; p.write_text(s.replace(old,new))"

      - name: Apply frozen Production Pack 01 + Pack 02
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python ../skill-src/overlays/apply_highfly_skill_adapter.py
          python ../skill-src/overlays/apply_highfly_skill_adapter_fix1.py
          python ../skill-src/overlays/apply_highfly_vertical_slice_tests.py
          python ../skill-src/overlays/apply_highfly_jump_smash_full.py
          python ../skill-src/overlays/apply_highfly_jump_smash_facing_fix.py
          python ../skill-src/overlays/apply_highfly_production_pack01.py
          python ../skill-src/overlays/apply_highfly_production_pack01_run0b.py
          python ../skill-src/overlays/apply_highfly_production_pack01_run0c.py
          python ../skill-src/overlays/apply_highfly_production_pack01_run0d.py
          python ../skill-src/overlays/apply_highfly_production_pack02.py
          python ../overlays/apply_skill_lab2_rogue_mutation.py
          python ../overlays/apply_skill_lab2_rogue_hardening.py
          python ../overlays/apply_skill_lab2_rogue_pack_r2.py
          python ../overlays/apply_skill_lab2_warlock_pack_r3.py
          python ../overlays/apply_skill_lab2_rw_poc_evil_eye.py
          python ../overlays/apply_skill_lab2_rw_r3_core_adapters.py
          python ../overlays/apply_skill_lab2_rw_r3_gold.py
          python ../overlays/apply_skill_lab2_wp_main3.py
          python ../overlays/apply_skill_lab2_wp_main3_gold.py
          python ../overlays/apply_skill_lab2_wp_execute.py
          python ../overlays/apply_skill_lab2_wp_paladin_heritage.py
          python ../overlays/apply_skill_lab2_wp_7of7_gold.py
          python ../overlays/apply_skill_lab2_ms_pyrelance_gold.py
          python ../overlays/apply_skill_lab2_ms_meteor_gold.py
          python ../overlays/apply_skill_lab2_ms_aether_darts_gold.py
          python ../overlays/apply_skill_lab2_ms_dragons_breath_gold.py
          python ../overlays/apply_skill_lab2_ms_faultwake_gold.py
          python ../overlays/apply_skill_lab2_ms_arc_bolt_gold.py
          python ../overlays/apply_skill_lab2_ms_shaman_heritage_bridge.py
          python ../overlays/apply_skill_lab2_ms_magma_burst_gold.py
          python ../overlays/apply_skill_lab2_hd_frostjaw_gold.py
          python ../overlays/apply_skill_lab2_hd_7of7_gold.py
          git diff --check
          git diff --stat

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Skill Lab focused tests
        working-directory: upstream
        run: |
          pnpm exec vitest run             tests/highfly_skill_adapter.test.ts             tests/highfly_validation_pack01.test.ts             tests/highfly_production_pack01.test.ts             tests/highfly_production_pack01_run0b.test.ts             tests/highfly_production_pack01_run0c.test.ts             tests/highfly_production_pack01_freeze.test.ts             tests/highfly_production_pack02.test.ts             tests/highfly_production_pack02_freeze.test.ts             tests/highfly_vertical_slice_contract.test.ts             tests/highfly_jump_smash_full.test.ts             tests/ground_aim_hud.test.ts             tests/ground_target_cast.test.ts             tests/heroic_leap.test.ts             tests/mobile_action_page_view.test.ts             tests/highfly_skill_lab2_rogue_mutation.test.ts             tests/highfly_skill_lab2_rogue_premium.test.ts             tests/highfly_skill_lab2_rogue_hardening.test.ts             tests/highfly_skill_lab2_rogue_pack_r2.test.ts             tests/highfly_skill_lab2_warlock_pack_r3.test.ts             tests/highfly_skill_lab2_rw_poc_evil_eye.test.ts             tests/highfly_skill_lab2_rw_r3_core_adapters.test.ts             tests/highfly_skill_lab2_rw_r3_gold.test.ts             tests/highfly_skill_lab2_wp_main3.test.ts             tests/highfly_skill_lab2_wp_main3_gold.test.ts             tests/highfly_skill_lab2_wp_execute.test.ts             tests/highfly_skill_lab2_wp_paladin_heritage.test.ts             tests/highfly_skill_lab2_wp_7of7_gold.test.ts             tests/highfly_skill_lab2_ms_pyrelance_gold.test.ts             tests/highfly_skill_lab2_ms_meteor_gold.test.ts             tests/highfly_skill_lab2_ms_aether_darts_gold.test.ts             tests/highfly_skill_lab2_ms_dragons_breath_gold.test.ts             tests/highfly_skill_lab2_ms_faultwake_gold.test.ts             tests/highfly_skill_lab2_ms_arc_bolt_gold.test.ts             tests/highfly_skill_lab2_ms_shaman_heritage_bridge.test.ts             tests/highfly_skill_lab2_ms_magma_burst_gold.test.ts             tests/highfly_skill_lab2_hd_frostjaw_gold.test.ts             tests/highfly_skill_lab2_hd_7of7_gold.test.ts

      - name: Apply Skill Lab playable harness
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python ../overlays/apply_current_skill_lab_pack01.py
          python ../overlays/apply_skill_lab2_ms_pack456_lab.py
          python ../overlays/apply_skill_lab2_ms_pack7_lab.py
          python ../overlays/apply_skill_lab2_hd_frostjaw_lab.py
          python ../overlays/apply_skill_lab2_hd_7of7_lab.py
          python ../overlays/apply_highfly_labskill_lvl20_10slot.py
          git diff --check

      - name: HIGHFLY LABSKILL 5+5 contract tests
        working-directory: upstream
        run: pnpm exec vitest run tests/highfly_labskill_lvl20_10slot.test.ts

      - name: TypeScript source check
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > tsconfig.skill-lab-src.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "include": ["src/**/*.ts", "src/**/*.tsx"],
            "exclude": ["tests/**"]
          }
          EOF
          pnpm exec tsc --project tsconfig.skill-lab-src.json --noEmit --incremental false

      - name: Build current Skill Lab
        working-directory: upstream
        env:
          VITE_COBALT_OFFLINE: "1"
          VITE_COBALT_BASE: "/u6-mobile-runtime-probe/"
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:bundle
          node scripts/build_media_manifest.mjs prune
          cp ../foundation-src/overlays/rewrite_pages_static.py ../rewrite_pages_static_skill_lab.py
          sed -i 's#/cobalt-hollow-lab#/u6-mobile-runtime-probe#g' ../rewrite_pages_static_skill_lab.py
          python ../rewrite_pages_static_skill_lab.py
          touch dist/.nojekyll
          du -sh dist

      - name: Jump Smash browser smoke on Skill Lab base
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cp ../skill-src/overlays/highfly_jump_smash_browser_smoke.mjs ./highfly_jump_smash_browser_smoke.mjs
          sed -i 's#/cobalt-hollow-lab/#/u6-mobile-runtime-probe/#g' ./highfly_jump_smash_browser_smoke.mjs
          sed -i "s/Boolean(window.__game?.sim?.player), null, { timeout: 30000 }/Boolean(window.__game?.sim?.player), null, { timeout: 60000 }/" ./highfly_jump_smash_browser_smoke.mjs
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --base=/u6-mobile-runtime-probe/ > ../skill-lab-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/u6-mobile-runtime-probe/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node ./highfly_jump_smash_browser_smoke.mjs

      - name: Current Skill Lab browser smoke
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cp ../overlays/highfly_current_skill_lab_smoke.mjs ./highfly_current_skill_lab_smoke.mjs
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --base=/u6-mobile-runtime-probe/ > ../current-skill-lab-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/u6-mobile-runtime-probe/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node ./highfly_current_skill_lab_smoke.mjs

      - name: Skill Lab 2.0 Rogue mutation browser smoke
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cp ../overlays/highfly_skill_lab2_rogue_smoke.mjs ./highfly_skill_lab2_rogue_smoke.mjs
          pnpm exec vite preview --host 127.0.0.1 --port 4174 --base=/u6-mobile-runtime-probe/ > ../skill-lab2-run1-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
