            if curl -fsS http://127.0.0.1:4174/u6-mobile-runtime-probe/ >/dev/null; then
              break
            fi
            sleep 1
          done
          sed -i 's#127.0.0.1:4173#127.0.0.1:4174#g' ./highfly_skill_lab2_rogue_smoke.mjs
          node ./highfly_skill_lab2_rogue_smoke.mjs

      - name: Skill Lab 2.0 Rogue GOLD hardening browser smoke
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cp ../overlays/highfly_skill_lab2_rogue_hardening_smoke.mjs ./highfly_skill_lab2_rogue_hardening_smoke.mjs
