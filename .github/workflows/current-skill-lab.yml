          done
          node ./highfly_skill_lab2_rogue_pack_r2_smoke.mjs

      - name: Skill Lab 2.0 Rogue Warlock R3 GOLD browser smoke
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cp ../overlays/highfly_skill_lab2_rw_r3_gold_smoke.mjs ./highfly_skill_lab2_rw_r3_gold_smoke.mjs
          pnpm exec vite preview --host 127.0.0.1 --port 4177 --base=/u6-mobile-runtime-probe/ > ../skill-lab2-rw-r3-preview.log 2>&1 &
