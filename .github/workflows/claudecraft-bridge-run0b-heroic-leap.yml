name: HIGHFLY ClaudeCraft Bridge Run0B Heroic Leap

on:
  workflow_dispatch:
  push:
    branches: [highfly/claudecraft-unity-bridge-lab]
    paths:
      - "ci/claudecraft-bridge/**"
      - ".github/workflows/claudecraft-bridge-run0b-heroic-leap.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: highfly-claudecraft-run0b-heroic-leap
  cancel-in-progress: true

jobs:
  build:
    name: Build RUN0B • ClaudeCraft Heroic Leap • Unity 6000.6.2
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout probe repo
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Add swap for Unity import
        shell: bash
        run: |
          set -euxo pipefail
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          swapon --show

      - name: Download pinned Lucid with Git LFS
        shell: bash
        run: |
          set -euxo pipefail
          mkdir LucidHost
          git -C LucidHost init
          git -C LucidHost remote add origin https://github.com/DohunWi/3D-Action.git
          git -C LucidHost lfs install --local
          GIT_LFS_SKIP_SMUDGE=1 git -C LucidHost fetch --depth 1 origin da73b5be7ffa7216c48e196c4a69fe3ff66c6c65
          GIT_LFS_SKIP_SMUDGE=1 git -C LucidHost checkout --detach FETCH_HEAD
          git -C LucidHost lfs pull

      - name: Remove Unity AI Assistant incompatible with 6000.6.2
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("LucidHost/3D_game/Packages")
          for name in ("manifest.json","packages-lock.json"):
              p=root/name
              data=json.loads(p.read_text(encoding="utf-8"))
              data.get("dependencies",{}).pop("com.unity.ai.assistant",None)
              p.write_text(json.dumps(data,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Install Run0I complete combat core
        shell: bash
        run: |
          set -euxo pipefail
          P="LucidHost/3D_game"
          mkdir -p "$P/Assets/HIGHFLY/Core/Mobile" "$P/Assets/HIGHFLY/Core/Combat"                    "$P/Assets/HIGHFLY/Run0H" "$P/Assets/HIGHFLY/Run0I"                    "$P/Assets/Resources/HIGHFLY/Run0H" "$P/Assets/Resources/HIGHFLY/Run0I"                    "$P/Assets/Plugins/WebGL" "$P/Assets/Editor"

          cp ci/mobile/HighflyMobileCore.cs "$P/Assets/HIGHFLY/Core/Mobile/HighflyMobileCore.cs"
          cp ci/mobile/HighflyMobileText.cs "$P/Assets/HIGHFLY/Core/Mobile/HighflyMobileText.cs"
          cp ci/mobile/HighflyThirdPersonMobileCamera.cs "$P/Assets/HIGHFLY/Core/Mobile/HighflyThirdPersonMobileCamera.cs"
          cp ci/combat/HighflyCombatCore.cs "$P/Assets/HIGHFLY/Core/Combat/HighflyCombatCore.cs"
          cp ci/run0i2/HighflyDirectionalMeleeCore.cs "$P/Assets/HIGHFLY/Core/Combat/HighflyDirectionalMeleeCore.cs"
          cp ci/run0i/HighflyRun0ICombatBridge.cs "$P/Assets/HIGHFLY/Core/Combat/HighflyLucidCombatBridge.cs"

          cp ci/run0i/HighflyRun0ICompat.cs "$P/Assets/HIGHFLY/Run0I/HighflyRun0ICompat.cs"
          cp ci/run0i/HighflyRun0ICharacterVisual.cs "$P/Assets/HIGHFLY/Run0I/HighflyRun0ICharacterVisual.cs"
          cp ci/run0i/HighflyRun0IParkour.cs "$P/Assets/HIGHFLY/Run0I/HighflyRun0IParkour.cs"
          cp ci/run0i/HighflyRun0IAttackDummy.cs "$P/Assets/HIGHFLY/Run0I/HighflyRun0IAttackDummy.cs"
          cp ci/run0i/HighflyRun0IOverlay.cs "$P/Assets/HIGHFLY/Run0I/HighflyRun0IOverlay.cs"
          cp ci/run0h/HighflyRun0HLabBootstrap.cs "$P/Assets/HIGHFLY/Run0H/HighflyRun0HLabBootstrap.cs"

          cp ci/mobile/MainMenuController.Mobile.cs "$P/Assets/Scripts/Manager/MainMenuController.cs"
          cp ci/mobile/DialogueUI.Mobile.cs "$P/Assets/Scripts/Interaction/DialogueUI.cs"
          cp ci/mobile/TutorialUI.Mobile.cs "$P/Assets/Scripts/Interaction/TutorialUI.cs"
          cp ci/mobile/PlayerInteraction.Mobile.cs "$P/Assets/Scripts/Player/PlayerInteraction.cs"
          cp ci/mobile/PlayerController.Mobile.cs "$P/Assets/Scripts/Player/PlayerController.cs"
          cp ci/mobile/PlayerStats.Mobile.cs "$P/Assets/Scripts/Player/PlayerStats.cs"
          cp ci/mobile/PlayerPotion.Mobile.cs "$P/Assets/Scripts/Player/PlayerPotion.cs"

          cp ci/mobile/HighflyWebGL.jslib "$P/Assets/Plugins/WebGL/HighflyWebGL.jslib"
          cp ci/mobile/InputSystem_Actions.Mobile.inputactions "$P/Assets/InputSystem_Actions.inputactions"
          cp ci/run0i/HighflyRun0IModelImporter.cs "$P/Assets/Editor/HighflyRun0IModelImporter.cs"
          cp ci/run0i/HighflyRun0IWebGLBuilder.cs "$P/Assets/Editor/HighflyRun0IWebGLBuilder.cs"

          KAYKIT="$RUNNER_TEMP/KayKit-Adventurers"
          git clone --filter=blob:none https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0.git "$KAYKIT"
          git -C "$KAYKIT" checkout 672074b73ba276876a19e8816ecdc5241817ab47
          git -C "$KAYKIT" lfs install --local || true
          git -C "$KAYKIT" lfs pull || true
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Characters/fbx/Knight.fbx" "$P/Assets/Resources/HIGHFLY/Run0H/KayKitKnight.fbx"
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Characters/fbx/knight_texture.png" "$P/Assets/Resources/HIGHFLY/Run0H/knight_texture.png"
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Characters/fbx/Rogue.fbx" "$P/Assets/Resources/HIGHFLY/Run0H/KayKitRogue.fbx"
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Characters/fbx/RogueHooded.fbx" "$P/Assets/Resources/HIGHFLY/Run0H/KayKitRogueHooded.fbx"
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Characters/fbx/Barbarian.fbx" "$P/Assets/Resources/HIGHFLY/Run0H/KayKitBarbarian.fbx"
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Characters/fbx/rogue_texture.png" "$P/Assets/Resources/HIGHFLY/Run0H/rogue_texture.png"
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Characters/fbx/barbarian_texture.png" "$P/Assets/Resources/HIGHFLY/Run0H/barbarian_texture.png"
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Assets/fbx/sword_1handed.fbx" "$P/Assets/Resources/HIGHFLY/Run0H/KayKitSword1H.fbx"
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Assets/fbx/axe_1handed.fbx" "$P/Assets/Resources/HIGHFLY/Run0H/KayKitAxe1H.fbx"
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Assets/fbx/dagger.fbx" "$P/Assets/Resources/HIGHFLY/Run0H/KayKitDagger.fbx"
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Assets/fbx/shield_round.fbx" "$P/Assets/Resources/HIGHFLY/Run0H/KayKitShieldRound.fbx"

          # Quaternius Modular Weapons Pack • Spear.fbx • CC0 1.0
          # Provenance record: https://quaternius.com/packs/medievalweapons.html
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/DevHuang1/embervale-godot/3f511a60fa9822a7de280a8da95a863525998237/assets/models/weapons/quaternius/Spear.fbx"             -o "$P/Assets/Resources/HIGHFLY/Run0H/QuaterniusSpear.fbx"
          test -s "$P/Assets/Resources/HIGHFLY/Run0H/QuaterniusSpear.fbx"

          curl -L --fail --retry 3             "https://raw.githubusercontent.com/Magellan36/bunker-game/a3f75bf101c1d454a51bee4e4a77a60a082c0175/assets/models/WIP/FINAL/Universal%20Animation%20Library%202%5BStandard%5D/Universal%20Animation%20Library%202%5BStandard%5D/Unity/UAL2_Standard.fbx"             -o "$P/Assets/HIGHFLY/Run0I/UAL2_Standard.fbx"
          echo "d26d0e9f4a202d473194c056045143095a605a53ba1d823ef24055be4b86851d  $P/Assets/HIGHFLY/Run0I/UAL2_Standard.fbx" | sha256sum -c -

          KENNEY="https://raw.githubusercontent.com/Calinou/kenney-particle-pack/ab7086639ee73be31abd87feb21bf1402d4e8144/addons/kenney_particle_pack"
          curl -L --fail --retry 3 "$KENNEY/slash_02.png" -o "$P/Assets/Resources/HIGHFLY/Run0I/slash_02.png"

          cp "$P/Assets/UnityTechnologies/ParticlePack/EffectExamples/Legacy Particles/Prefabs/SparksEffect.prefab"              "$P/Assets/Resources/HIGHFLY/Run0I/SparksEffect.prefab"
          cp "$P/Assets/SFX/swing.mp3" "$P/Assets/Resources/HIGHFLY/Run0I/swing.mp3"
          cp "$P/Assets/SFX/longSwing.mp3" "$P/Assets/Resources/HIGHFLY/Run0I/longSwing.mp3"
          cp "$P/Assets/SFX/Dragon/hit.mp3" "$P/Assets/Resources/HIGHFLY/Run0I/hit.mp3"

          test ! -d "$P/Assets/HIGHFLY/Lab"
          grep -q "SonicLeap" "$P/Assets/HIGHFLY/Core/Combat/HighflyLucidCombatBridge.cs"
          grep -q "OverlapCapsuleNonAlloc" "$P/Assets/HIGHFLY/Core/Combat/HighflyLucidCombatBridge.cs"
          grep -q "HighflyRun0IParkour" "$P/Assets/HIGHFLY/Run0I/HighflyRun0IParkour.cs"
          grep -q "HighflyLoadoutProfile" "$P/Assets/HIGHFLY/Core/Combat/HighflyDirectionalMeleeCore.cs"
          echo "RUN0I3_SINGLE_HUNTER_GUARD_INSTALLED=1"

      - name: Install official Sidekick 1.2.6 runtime subset
        shell: bash
        run: |
          set -euxo pipefail
          P="LucidHost/3D_game"
          URL="https://github.com/SyntyStudios/SidekicksToolRelease/releases/download/1.2.6/Sidekicks.unitypackage"
          curl -L --fail --retry 5 "$URL" -o /tmp/Sidekicks.unitypackage
          echo "248fb193e2fe3f8f9fe48d63564de6ff9e59aaaebeb2168aee9de231d842a6e0  /tmp/Sidekicks.unitypackage" | sha256sum -c -

          python3 ci/sidekick/extract_sidekick126_subset.py \
            --package /tmp/Sidekicks.unitypackage \
            --project "$P"

          test -f "$P/Assets/Resources/HIGHFLY/Run0I/Sidekick126.prefab"
          test -f "$P/Assets/Synty/SidekickCharacters/Resources/Shaders/Sidekick_ShaderGraph.shadergraph"
          grep -q "db628544640279b41a4a7aa5d75c0322" \
            "$P/Assets/Synty/SidekickCharacters/Resources/Shaders/Sidekick_ShaderGraph.shadergraph.meta"
          echo "SKILL3_SIDEKICK126_RUNTIME_INSTALLED=1"

      - name: Install KayKit 1.1 melee animation donor
        shell: bash
        run: |
          set -euxo pipefail
          P="LucidHost/3D_game"
          mkdir -p "$P/Assets/HIGHFLY/Run0I"
          URL="https://media.githubusercontent.com/media/series-ai/jam-ready-assets/main/kaykit-character-animations/3D/characters/Animations/fbx/Rig_Medium/Rig_Medium_CombatMelee.fbx"
          curl -L --fail --retry 5 "$URL" -o "$P/Assets/HIGHFLY/Run0I/KayKit_Rig_Medium_CombatMelee.fbx"
          echo "018ba1c4f2ad30e9d4b051f12c46eb3fa3da01c1d4cba3603f673dca3bf899ca  $P/Assets/HIGHFLY/Run0I/KayKit_Rig_Medium_CombatMelee.fbx" | sha256sum -c -
          test "$(stat -c%s "$P/Assets/HIGHFLY/Run0I/KayKit_Rig_Medium_CombatMelee.fbx")" -gt 3000000
          echo "SKILL3_KAYKIT_MELEE11_INSTALLED=1"

      - name: Install audited SKILL4 weapon donors
        shell: bash
        run: |
          set -euxo pipefail
          P="LucidHost/3D_game"

          # KayKit Fantasy Weapons Bits 1.0 • CC0 • exact byte matches to the user-audited ZIP.
          # Pinned public mirror only transports the verified bytes; hashes below are the gate.
          KFB_BASE="https://raw.githubusercontent.com/LeLicorne/hamchat/614ea6ec5adb92293ad61b33700f6a8087ec0609/models/KayKit_FantasyWeaponsBits_1.0_FREE/Assets/fbx(unity)"
          curl -L --fail --retry 5 "$KFB_BASE/dagger_A.fbx" -o "$P/Assets/Resources/HIGHFLY/Run0I/KayKitFantasyDaggerA.fbx"
          curl -L --fail --retry 5 "$KFB_BASE/axe_A.fbx" -o "$P/Assets/Resources/HIGHFLY/Run0I/KayKitFantasyAxeA.fbx"
          curl -L --fail --retry 5 "$KFB_BASE/spear_A.fbx" -o "$P/Assets/Resources/HIGHFLY/Run0I/KayKitFantasySpearA.fbx"
          curl -L --fail --retry 5 "$KFB_BASE/weapons_bits_texture.png" -o "$P/Assets/Resources/HIGHFLY/Run0I/weapons_bits_texture.png"

          test "$(git hash-object --no-filters "$P/Assets/Resources/HIGHFLY/Run0I/KayKitFantasyDaggerA.fbx")" = "a6dc58bebfbd01255f8b90a9d752ac6e2903d3b7"
          test "$(git hash-object --no-filters "$P/Assets/Resources/HIGHFLY/Run0I/KayKitFantasyAxeA.fbx")" = "207d3df65dca1a971771d69972ce03e26b1f04ad"
          test "$(git hash-object --no-filters "$P/Assets/Resources/HIGHFLY/Run0I/KayKitFantasySpearA.fbx")" = "94a3dd51879443163f9936d866bdeb5f26aa1666"
          test "$(git hash-object --no-filters "$P/Assets/Resources/HIGHFLY/Run0I/weapons_bits_texture.png")" = "f94f11e0384d09132f8dbfc64d811812875dcc64"

          QBASE="https://raw.githubusercontent.com/DevHuang1/embervale-godot/3f511a60fa9822a7de280a8da95a863525998237/assets/models/weapons/quaternius"

          curl -L --fail --retry 5 "$QBASE/Sword_Golden.fbx" -o "$P/Assets/Resources/HIGHFLY/Run0I/QSwordGolden.fbx"
          curl -L --fail --retry 5 "$QBASE/Dagger_2.fbx" -o "$P/Assets/Resources/HIGHFLY/Run0I/QDagger2.fbx"
          curl -L --fail --retry 5 "$QBASE/Axe_Double.fbx" -o "$P/Assets/Resources/HIGHFLY/Run0I/QAxeDouble.fbx"
          curl -L --fail --retry 5 "$QBASE/Shield_Celtic_Golden.fbx" -o "$P/Assets/Resources/HIGHFLY/Run0I/QShieldCelticGolden.fbx"

          test -s "$P/Assets/Resources/HIGHFLY/Run0I/QSwordGolden.fbx"
          test -s "$P/Assets/Resources/HIGHFLY/Run0I/QDagger2.fbx"
          test -s "$P/Assets/Resources/HIGHFLY/Run0I/QAxeDouble.fbx"
          test -s "$P/Assets/Resources/HIGHFLY/Run0I/QShieldCelticGolden.fbx"

          PRIDE_URL="https://synty.epochfall.com/POLYGON%20-%20Pride%20Crystal%20Weapons/POLYGON_Pride_Weapons_Unity_2022_3_v1_1_0.unitypackage"
          curl -L --fail --retry 5 "$PRIDE_URL" -o /tmp/POLYGON_Pride_Weapons.unitypackage
          test -s /tmp/POLYGON_Pride_Weapons.unitypackage
          python3 ci/sidekick/extract_unitypackage_all.py \
            --package /tmp/POLYGON_Pride_Weapons.unitypackage \
            --project "$P"

          find "$P/Assets" -type f -ipath '*pride*' -print | sed -n '1,40p'
          test -n "$(find "$P/Assets" -type f \( -iname '*sword*.fbx' -o -iname '*sword*.prefab' \) -ipath '*pride*' -print -quit)"
          test -n "$(find "$P/Assets" -type f \( -iname '*spear*.fbx' -o -iname '*spear*.prefab' \) -ipath '*pride*' -print -quit)"
          echo "SKILL4_AUDITED_WEAPON_DONORS_INSTALLED=1"
          echo "SKILL4_KAYKIT_FANTASY_GRIP_ORIGIN_INSTALLED=1"

      - name: Install ClaudeCraft Heroic Leap donor and bridge runtime
        shell: bash
        run: |
          set -euxo pipefail
          P="LucidHost/3D_game"
          mkdir -p "$P/Assets/HIGHFLY/ClaudeBridge" "$P/Assets/Resources/HIGHFLY/ClaudeBridge" "$P/Assets/Editor"

          # Exact ClaudeCraft v0.43.3 animation-only donor GLB.
          curl -L --fail --retry 5             "https://raw.githubusercontent.com/levy-street/world-of-claudecraft/cecebab4da06287351b37e118c630c185717b81c/public/models/chars/players/warrior_ability_anims.glb"             -o /tmp/warrior_ability_anims.glb
          test "$(stat -c%s /tmp/warrior_ability_anims.glb)" = "24480"
          test "$(git hash-object --no-filters /tmp/warrior_ability_anims.glb)" = "753fd1a93c59a9e987f57262a6c46e2e70112b71"

          # Convert the animation-only GLB to an FBX Unity can ingest using Assimp.
          sudo apt-get update -y
          sudo apt-get install -y assimp-utils
          assimp info /tmp/warrior_ability_anims.glb | tee /tmp/claude-heroic-info.txt
          grep -q "Animations" /tmp/claude-heroic-info.txt
          assimp export /tmp/warrior_ability_anims.glb "$P/Assets/HIGHFLY/ClaudeBridge/ClaudeHeroicLeap.fbx" -f fbx
          test -s "$P/Assets/HIGHFLY/ClaudeBridge/ClaudeHeroicLeap.fbx"

          cp ci/claudecraft-bridge/HighflyClaudeHeroicLeapRuntime.cs             "$P/Assets/HIGHFLY/ClaudeBridge/HighflyClaudeHeroicLeapRuntime.cs"
          cp ci/claudecraft-bridge/HighflyClaudeRun0BBuilder.cs             "$P/Assets/Editor/HighflyClaudeRun0BBuilder.cs"

          # Translate Claude's physical landing VFX contract with real project effects.
          cp "$P/Assets/UnityTechnologies/ParticlePack/EffectExamples/Magic Effects/Prefabs/EarthShatter.prefab"             "$P/Assets/Resources/HIGHFLY/ClaudeBridge/EarthShatter.prefab"
          cp "$P/Assets/UnityTechnologies/ParticlePack/EffectExamples/Legacy Particles/Prefabs/SparksEffect.prefab"             "$P/Assets/Resources/HIGHFLY/ClaudeBridge/SparksEffect.prefab"
          cp "$P/Assets/UnityTechnologies/ParticlePack/EffectExamples/Smoke & Steam Effects/Prefabs/SmokeEffect.prefab"             "$P/Assets/Resources/HIGHFLY/ClaudeBridge/SmokeEffect.prefab"

          grep -q "FlightDuration = 0.60f" "$P/Assets/HIGHFLY/ClaudeBridge/HighflyClaudeHeroicLeapRuntime.cs"
          grep -q "FlightApex = 3.20f" "$P/Assets/HIGHFLY/ClaudeBridge/HighflyClaudeHeroicLeapRuntime.cs"
          grep -q "LandingRadius = 6f" "$P/Assets/HIGHFLY/ClaudeBridge/HighflyClaudeHeroicLeapRuntime.cs"
          grep -q "DamageMin = 24" "$P/Assets/HIGHFLY/ClaudeBridge/HighflyClaudeHeroicLeapRuntime.cs"
          echo "CLAUDECRAFT_RUN0B_HEROIC_LEAP_INSTALLED=1"

      - name: Reset Unity transient cache
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf LucidHost/3D_game/Library
          rm -rf LucidHost/3D_game/Temp
          rm -rf LucidHost/3D_game/obj
          mkdir -p LucidHost/3D_game/Library
          free -h

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: LucidHost/3D_game
          unityVersion: 6000.6.2f1
          targetPlatform: WebGL
          buildMethod: Highfly.ClaudeBridge.Editor.Run0BBuilder.Build
          customParameters: -job-worker-count 1
          allowDirtyBuild: true

      - name: Verify Run0I
        shell: bash
        run: |
          set -euxo pipefail
          OUT="LucidHost/3D_game/build/WebGL"
          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          chmod -R u+rwX "$OUT"
          test -f "$OUT/index.html"
          test -f "$OUT/RUN0I3_BUILD.txt"
          test -d "$OUT/Build"
          test -n "$(find "$OUT/Build" -maxdepth 1 -type f -name '*.wasm' -size +0c -print -quit)"
          test -n "$(find "$OUT/Build" -maxdepth 1 -type f -name '*.framework.js' -size +0c -print -quit)"
          test -z "$(find "$OUT/Build" -maxdepth 1 -type f \( -name '*.gz' -o -name '*.br' \) -print -quit)"
          grep -q "KAYKIT WEAPON FOUNDATION" "$OUT/RUN0I3_BUILD.txt"
          grep -q "10 LOADOUTS" "$OUT/RUN0I3_BUILD.txt"
          grep -q "UNARMED R-L-KICK" "$OUT/RUN0I3_BUILD.txt"
          grep -q "HUNTER BASE ROGUE HOODED" "$OUT/RUN0I3_BUILD.txt"
          grep -q "KAYKIT FANTASY GRIP ORIGIN" "$OUT/RUN0I3_BUILD.txt"
          grep -q "SKIN PROP CLEANUP" "$OUT/RUN0I3_BUILD.txt"
          grep -q "ALL MELEE CLASSIC 1-2-3 SPIN" "$OUT/RUN0I3_BUILD.txt"
          grep -q "SHIELD ATK-ATK-HEAVY SHOVE" "$OUT/RUN0I3_BUILD.txt"
          grep -q "SPEAR THRUST-SWEEP-THRUST" "$OUT/RUN0I3_BUILD.txt"
          grep -q "NORMALIZED BASIC SPEED" "$OUT/RUN0I3_BUILD.txt"
          test -f "$OUT/CLAUDE_RUN0B_BUILD.txt"
          grep -q "HEROIC LEAP COMPLETE PORT" "$OUT/CLAUDE_RUN0B_BUILD.txt"
          grep -q "FLIGHT 0.60" "$OUT/CLAUDE_RUN0B_BUILD.txt"
          grep -q "APEX 3.20" "$OUT/CLAUDE_RUN0B_BUILD.txt"
          grep -q "AOE 6" "$OUT/CLAUDE_RUN0B_BUILD.txt"
          grep -q "DAMAGE 24-32" "$OUT/CLAUDE_RUN0B_BUILD.txt"

      - name: Upload Run0I WebGL
        uses: actions/upload-artifact@v4
        with:
          name: highfly-claudecraft-run0b-heroic-leap-webgl
          path: LucidHost/3D_game/build/WebGL
          if-no-files-found: error
          retention-days: 7
