name: Publish SKILL3 Arsenal Pass 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-skill3-arsenal-pass1.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: highfly-pages-skill3-arsenal-pass1
  cancel-in-progress: true

jobs:
  publish:
    name: Overlay Arsenal Pass 1 onto known-good Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download last known-good Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: previous-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36286906861

      - name: Restore known-good site
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf site
          mkdir -p site
          TAR="$(find previous-pages -type f -name '*.tar' -print -quit)"
          test -n "$TAR"
          tar -xf "$TAR" -C site
          test -f site/index.html
          test -d site/skill3-sidekick126
          echo "KNOWN_GOOD_SITE_RESTORED=1"

      - name: Download SKILL3 Arsenal Pass 1 artifact
        uses: actions/download-artifact@v4
        with:
          name: highfly-run0i3-webgl
          path: incoming/skill3-arsenal-pass1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36308395838

      - name: Overlay and validate Arsenal Pass 1
        shell: bash
        run: |
          set -euxo pipefail
          test -f incoming/skill3-arsenal-pass1/index.html
          test -f incoming/skill3-arsenal-pass1/RUN0I3_BUILD.txt
          test -d incoming/skill3-arsenal-pass1/Build
          grep -q "ARSENAL PASS 1" incoming/skill3-arsenal-pass1/RUN0I3_BUILD.txt
          grep -q "POLYGON PRIDE + QUATERNIUS" incoming/skill3-arsenal-pass1/RUN0I3_BUILD.txt
          grep -q "SIDEKICK PROP SOCKETS" incoming/skill3-arsenal-pass1/RUN0I3_BUILD.txt

          rm -rf site/skill3-arsenal-pass1
          mkdir -p site/skill3-arsenal-pass1
          cp -a incoming/skill3-arsenal-pass1/. site/skill3-arsenal-pass1/

          test -f site/skill3-arsenal-pass1/index.html
          test -d site/skill3-arsenal-pass1/Build
          touch site/.nojekyll
          echo "SKILL3_ARSENAL_PASS1_RUN=36308395838" > site/SKILL3_ARSENAL_PASS1.txt
          du -sh site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
