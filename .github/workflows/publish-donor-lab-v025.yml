name: Publish HIGHFLY Donor Lab v2.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-donor-lab-v025.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: highfly-donor-lab-v025-pages
  cancel-in-progress: true

jobs:
  stage:
    name: Merge current Pages + DONOR Lab 2.5
    runs-on: ubuntu-latest
    steps:
      - name: Download current combined Pages site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: current-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35906402554

      - name: Download verified DONOR Lab 2.5 WebGL
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: donor-v25-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35910867190

      - name: Assemble combined site
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site donor-v25-extracted

          test -f current-pages/artifact.tar
          tar -xf current-pages/artifact.tar -C site

          test -f site/index.html
          test -f site/donor-lab-v24/index.html

          test -f donor-v25-pages/artifact.tar
          tar -xf donor-v25-pages/artifact.tar -C donor-v25-extracted
          test -f donor-v25-extracted/index.html
          grep -q "v=0250" donor-v25-extracted/index.html
          grep -q "highfly-desktop-fit" donor-v25-extracted/index.html

          rm -rf site/donor-lab-v25
          mkdir -p site/donor-lab-v25
          cp -a donor-v25-extracted/. site/donor-lab-v25/

          test -f site/donor-lab-v25/index.html
          test -f site/donor-lab-v25/Build/WebGL.loader.js
          test -f site/donor-lab-v25/Build/WebGL.wasm
          test -f site/donor-lab-v25/Build/WebGL.data

          echo "HIGHFLY DONOR LAB 2.5 • VERIFIED BUILD RUN 35910867190 • COMBAT LINK" > site/donor-lab-v25/published-version.txt
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy current Pages + DONOR Lab 2.5
    needs: stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
