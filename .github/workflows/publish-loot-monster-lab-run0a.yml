name: Build + Publish HIGHFLY Loot Monster Lab Run0A

on:
  workflow_dispatch:
  push:
    branches:
      - highfly/loot-monster-lab-run0a
    paths:
      - "ci/lootlab/**"
      - "ci/mobile/**"
      - "ci/HighflyCiWebGLBuilder.cs"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: highfly-loot-monster-lab-run0a
  cancel-in-progress: true

jobs:
  build:
    name: Build Loot / Monster Lab Run0A
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Download pinned Lucid host with Git LFS
        shell: bash
        run: |
          set -euxo pipefail
          git lfs version
          mkdir LucidHost
          git -C LucidHost init
          git -C LucidHost remote add origin https://github.com/DohunWi/3D-Action.git
          git -C LucidHost lfs install --local
          GIT_LFS_SKIP_SMUDGE=1 git -C LucidHost fetch --depth 1 origin da73b5be7ffa7216c48e196c4a69fe3ff66c6c65
          GIT_LFS_SKIP_SMUDGE=1 git -C LucidHost checkout --detach FETCH_HEAD
          git -C LucidHost lfs pull
          test -f LucidHost/3D_game/ProjectSettings/ProjectVersion.txt
          cat LucidHost/3D_game/ProjectSettings/ProjectVersion.txt

      - name: Install HIGHFLY Loot Lab + Golden movement/camera
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p LucidHost/3D_game/Assets/HIGHFLY/LootLab
          mkdir -p LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile
          mkdir -p LucidHost/3D_game/Assets/Plugins/WebGL
          mkdir -p LucidHost/3D_game/Assets/Editor

          # Loot runtime
          cp ci/lootlab/HighflyLootCore.cs              LucidHost/3D_game/Assets/HIGHFLY/LootLab/HighflyLootCore.cs
          cp ci/lootlab/HighflyLootMonsterLabBootstrap.cs              LucidHost/3D_game/Assets/HIGHFLY/LootLab/HighflyLootMonsterLabBootstrap.cs
          cp ci/lootlab/HighflyLootSkillCompat.cs              LucidHost/3D_game/Assets/HIGHFLY/LootLab/HighflyLootSkillCompat.cs

          # Reuse the same Golden movement/camera stack proven in Skill Lab.
          cp ci/mobile/HighflyMobileCore.cs              LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyMobileCore.cs
          cp ci/mobile/HighflyMobileText.cs              LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyMobileText.cs
          cp ci/mobile/HighflyThirdPersonMobileCamera.cs              LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyThirdPersonMobileCamera.cs

          cp ci/mobile/HighflyWebGL.jslib              LucidHost/3D_game/Assets/Plugins/WebGL/HighflyWebGL.jslib
          cp ci/mobile/InputSystem_Actions.Mobile.inputactions              LucidHost/3D_game/Assets/InputSystem_Actions.inputactions

          # PlayerController replacement is the same mobile/golden locomotion bridge used by Skill Lab.
          cp ci/mobile/PlayerController.Mobile.cs              LucidHost/3D_game/Assets/Scripts/Player/PlayerController.cs

          cp ci/HighflyCiWebGLBuilder.cs              LucidHost/3D_game/Assets/Editor/HighflyCiWebGLBuilder.cs

          test -s LucidHost/3D_game/Assets/HIGHFLY/LootLab/HighflyLootCore.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/LootLab/HighflyLootMonsterLabBootstrap.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/LootLab/HighflyLootSkillCompat.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyMobileCore.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyThirdPersonMobileCamera.cs
          test -s LucidHost/3D_game/Assets/Scripts/Player/PlayerController.cs
          test -s LucidHost/3D_game/Assets/InputSystem_Actions.inputactions
          test -s LucidHost/3D_game/Assets/Plugins/WebGL/HighflyWebGL.jslib

          grep -q "SetHighflyMobileMove" LucidHost/3D_game/Assets/Scripts/Player/PlayerController.cs
          grep -q "HighflyThirdPersonMobileCamera" LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyMobileCore.cs
          grep -q "GOLDEN MOVEMENT/CAMERA" LucidHost/3D_game/Assets/HIGHFLY/LootLab/HighflyLootMonsterLabBootstrap.cs
          grep -q "MAT_GOBLIN_SCRAP_IRON" LucidHost/3D_game/Assets/HIGHFLY/LootLab/HighflyLootCore.cs
          grep -q "AUTO RUN 0A GREEN" LucidHost/3D_game/Assets/HIGHFLY/LootLab/HighflyLootMonsterLabBootstrap.cs

      - name: Force fresh Unity Library
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf LucidHost/3D_game/Library
          rm -rf LucidHost/3D_game/Temp
          mkdir -p LucidHost/3D_game/Library

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: LucidHost/3D_game
          unityVersion: 6000.4.0f1
          targetPlatform: WebGL
          buildMethod: Highfly.CI.WebGLBuilder.Build
          allowDirtyBuild: true
          customParameters: -job-worker-count 2

      - name: Verify WebGL output
        shell: bash
        run: |
          set -euxo pipefail
          OUT="LucidHost/3D_game/build/WebGL"
          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          chmod -R u+rwX "$OUT"
          test -w "$OUT"
          test -f "$OUT/index.html"
          test -d "$OUT/Build"
          test -n "$(find "$OUT/Build" -maxdepth 1 -type f -name '*.wasm*' -size +0c -print -quit)"
          test -n "$(find "$OUT/Build" -maxdepth 1 -type f -name '*.js*' -size +0c -print -quit)"
          echo "HIGHFLY_LOOT_MONSTER_LAB_RUN0A=1" > "$OUT/RUN0A_BUILD.txt"
          touch "$OUT/.nojekyll"
          du -sh "$OUT"

      - name: Upload Lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: highfly-loot-run0a-webgl
          path: LucidHost/3D_game/build/WebGL
          if-no-files-found: error
          retention-days: 2


  deploy:
    name: Publish Loot Lab Run0B Golden
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Resolve latest successful canonical Pages run
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=success&per_page=100" --jq '[.workflow_runs[] | select(.name=="HIGHFLY Run0I.3 Single Hunter Guard Core" or .name=="Lucid WebGL Pages")][0].id')"
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using canonical Pages run: $RUN_ID"

      - name: Download canonical Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: current-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.base.outputs.run_id }}

      - name: Download Loot Lab artifact
        uses: actions/download-artifact@v4
        with:
          name: highfly-loot-run0a-webgl
          path: lootlab

      - name: Assemble combined Pages site
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site
          test -f current-pages/artifact.tar
          tar -xf current-pages/artifact.tar -C site

          test -f lootlab/index.html
          test -d lootlab/Build
          test -f lootlab/RUN0A_BUILD.txt

          rm -rf site/loot-monster-lab-run0b-golden
          mkdir -p site/loot-monster-lab-run0b-golden
          cp -a lootlab/. site/loot-monster-lab-run0b-golden/

          echo "HIGHFLY LOOT / MONSTER LAB • RUN0B GOLDEN • PLAYERCONTROLLER REAL • GOLDEN CAMERA • GOLDEN MOBILE CORE"             > site/loot-monster-lab-run0b-golden/published-version.txt

          touch site/.nojekyll
          test -f site/loot-monster-lab-run0b-golden/index.html
          du -sh site/loot-monster-lab-run0b-golden

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
