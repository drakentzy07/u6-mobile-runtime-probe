name: Donor RAW Sigil Combat Suite

on:
  push:
    branches: [highfly/donor-lab-v2.2-gallery-character-ab]
    paths:
      - ".github/workflows/donor-raw-sigil-v22.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  raw-sigil-suite:
    name: Execute original Sigil CombatDemo skills
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout HIGHFLY probe
        uses: actions/checkout@v4

      - name: Assemble isolated Unity 6000.4 RAW donor project
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="$GITHUB_WORKSPACE/RawSigilSuite"
          mkdir -p "$PROJECT/Assets" "$PROJECT/Packages" "$PROJECT/ProjectSettings"

          cat > "$PROJECT/ProjectSettings/ProjectVersion.txt" <<'EOF'
          m_EditorVersion: 6000.4.0f1
          EOF

          cat > "$PROJECT/Packages/manifest.json" <<'EOF'
          {
            "dependencies": {
              "com.likeon.gas": "file:com.likeon.gas",
              "com.likeon.gas.movement": "file:com.likeon.gas.movement",
              "com.likeon.gas.combat": "file:com.likeon.gas.combat",
              "com.unity.inputsystem": "1.4.4",
              "com.unity.test-framework": "1.4.6",
              "com.unity.ugui": "2.0.0",
              "com.unity.modules.ai": "1.0.0",
              "com.unity.modules.animation": "1.0.0",
              "com.unity.modules.assetbundle": "1.0.0",
              "com.unity.modules.audio": "1.0.0",
              "com.unity.modules.director": "1.0.0",
              "com.unity.modules.imageconversion": "1.0.0",
              "com.unity.modules.imgui": "1.0.0",
              "com.unity.modules.jsonserialize": "1.0.0",
              "com.unity.modules.particlesystem": "1.0.0",
              "com.unity.modules.physics": "1.0.0",
              "com.unity.modules.physics2d": "1.0.0",
              "com.unity.modules.screencapture": "1.0.0",
              "com.unity.modules.ui": "1.0.0",
              "com.unity.modules.uielements": "1.0.0",
              "com.unity.modules.unitywebrequest": "1.0.0",
              "com.unity.modules.unitywebrequestassetbundle": "1.0.0",
              "com.unity.modules.unitywebrequestaudio": "1.0.0",
              "com.unity.modules.unitywebrequesttexture": "1.0.0",
              "com.unity.modules.unitywebrequestwww": "1.0.0"
            }
          }
          EOF

          git clone --filter=blob:none https://github.com/forestlii/sigil-gas.git "$PROJECT/Packages/com.likeon.gas"
          git -C "$PROJECT/Packages/com.likeon.gas" checkout dfb8e965968eca5a7d9f535d3e892ce4ef4e0b3a

          git clone --filter=blob:none https://github.com/forestlii/sigil-movement.git "$PROJECT/Packages/com.likeon.gas.movement"
          git -C "$PROJECT/Packages/com.likeon.gas.movement" checkout fe54835ac32c39a138de25fec2ae20e56096463c

          git clone --filter=blob:none https://github.com/forestlii/sigil-combat.git "$PROJECT/Packages/com.likeon.gas.combat"
          git -C "$PROJECT/Packages/com.likeon.gas.combat" checkout aeee8dcee73e447f577e64201d651829efe2d5c1

          # Package-internal tests are not part of the CombatDemo donor validation.
          rm -rf "$PROJECT/Packages/com.likeon.gas/Tests"                  "$PROJECT/Packages/com.likeon.gas.movement/Tests"                  "$PROJECT/Packages/com.likeon.gas.combat/Tests"

          mkdir -p "$PROJECT/Assets/SigilCombatDemo"
          cp -a "$PROJECT/Packages/com.likeon.gas.combat/Samples~/CombatDemo/." "$PROJECT/Assets/SigilCombatDemo/"

          # Keep the donor's own end-to-end CombatDemoSmokeTest, but omit unrelated
          # lower-level framework tests from this focused donor suite.
          rm -f "$PROJECT/Assets/SigilCombatDemo/Tests/CombatCorePlayTests.cs"                 "$PROJECT/Assets/SigilCombatDemo/Tests/CombatCorePlayTests.cs.meta"

          cat > "$PROJECT/Assets/SigilCombatDemo/Tests/HighflyRawWeaponExtraTests.cs" <<'EOF'
          using System.Collections;
          using NUnit.Framework;
          using UnityEngine;
          using UnityEngine.TestTools;
          using Likeon.GAS;

          namespace Likeon.GAS.Sample.CombatDemo.Tests
          {
              public class HighflyRawWeaponExtraTests
              {
                  [UnityTest]
                  public IEnumerator RAW_RangedAttack_SwitchesWeapon_And_ActivatesOriginalAbility()
                  {
                      var prefab = Resources.Load<GameObject>("CombatDemoPlayer");
                      Assert.IsNotNull(prefab);
                      var player = Object.Instantiate(prefab);

                      yield return null;
                      yield return null;

                      var asc = player.GetComponent<AbilitySystemComponent>();
                      var input = player.GetComponent<InputSystemComponent>();
                      Assert.IsNotNull(asc);
                      Assert.IsNotNull(input);
                      Assert.IsTrue(asc.HasMatchingGameplayTag(CombatDemoTags.Weapon_Melee));

                      input.ReceiveInput(
                          CombatDemoTags.Input_SwitchWeapon,
                          InputTriggerEvent.Started,
                          InputActionData.Empty);
                      yield return null;

                      Assert.IsTrue(asc.HasMatchingGameplayTag(CombatDemoTags.Weapon_Ranged));

                      bool activated = false;
                      asc.OnAbilityActivated += ability =>
                      {
                          if (ability.GetAbilityTags().HasTag(CombatDemoTags.Ability_Ranged))
                              activated = true;
                      };

                      input.ReceiveInput(
                          CombatDemoTags.Input_Attack,
                          InputTriggerEvent.Started,
                          InputActionData.Empty);
                      yield return null;

                      Assert.IsTrue(
                          activated,
                          "Original GA_RangedAttack must activate through the donor input/weapon route.");

                      Object.Destroy(player);
                      yield return null;
                  }
              }
          }
          EOF

          echo "RAW_SIGIL_SUITE_COMMIT=aeee8dcee73e447f577e64201d651829efe2d5c1"
          grep -q "TraceWindow = 0.3f" "$PROJECT/Assets/SigilCombatDemo/GA_MeleeAttack.cs"
          grep -q "FlashDistance = 5f" "$PROJECT/Assets/SigilCombatDemo/GA_Flash.cs"
          grep -q "MaxChargeTime = 1.2f" "$PROJECT/Assets/SigilCombatDemo/GA_Fireball.cs"
          grep -q "InitialSpeed: 26" "$PROJECT/Assets/SigilCombatDemo/Bullet_CombatDemo_Ranged.asset"
          grep -q "InitialSpeed: 16" "$PROJECT/Assets/SigilCombatDemo/Bullet_CombatDemo_Fireball.asset"

      - name: Run original CombatDemo PlayMode suite
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: RawSigilSuite
          testMode: PlayMode
          artifactsPath: raw-sigil-suite-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: HIGHFLY RAW Sigil Combat Suite

      - name: Upload RAW donor suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-sigil-combat-suite-results
          path: |
            raw-sigil-suite-artifacts
            artifacts
          if-no-files-found: ignore
