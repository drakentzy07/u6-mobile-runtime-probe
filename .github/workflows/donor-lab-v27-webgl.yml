          test -s LucidHost/3D_game/Assets/Resources/HIGHFLY/FinalVFX/spark_04.png
          test -s LucidHost/3D_game/Assets/Resources/HIGHFLY/FinalVFX/magic_03.png
          test -s LucidHost/3D_game/Assets/HIGHFLY/ThirdParty/KenneyParticlePack_LICENSE.txt
          test -s LucidHost/3D_game/Assets/Resources/HIGHFLY/AcceptedVFX/EarthShatter.prefab
          test -s LucidHost/3D_game/Assets/Resources/HIGHFLY/AcceptedVFX/EnergyExplosion.prefab
