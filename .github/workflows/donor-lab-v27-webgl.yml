          echo "HIGHFLY_MOBILE_CORE_V06_INSTALLED=1"

      - name: Install CI build script
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p LucidHost/3D_game/Assets/Editor
          cp ci/HighflyCiWebGLBuilder.cs LucidHost/3D_game/Assets/Editor/HighflyCiWebGLBuilder.cs
          cp ci/HighflyCharacterCompareImporterV022.cs LucidHost/3D_game/Assets/Editor/HighflyCharacterCompareImporterV022.cs

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: LucidHost/3D_game/Library
          key: lucid-6000.6.2f1-webgl-mobile-v06-donorlab-v027-kaykit-hunter-core-${{ hashFiles('ci/HighflyCiWebGLBuilder.cs', 'ci/mobile/**', 'ci/combat/**', 'ci/lab/**') }}
          restore-keys: |
            lucid-6000.6.2f1-webgl-mobile-v06-skilllab-v011-premium-slf10-
            lucid-6000.6.2f1-webgl-mobile-v06-skilllab-v010-slf-core-
            lucid-6000.6.2f1-webgl-mobile-v06-skilllab-v09-apex-pass-
            lucid-6000.6.2f1-webgl-mobile-v06-skilllab-v01-
            lucid-6000.6.2f1-webgl-mobile-v06-
            lucid-6000.6.2f1-webgl-lfs-v1-da73b5be-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: LucidHost/3D_game
          unityVersion: 6000.6.2f1
          targetPlatform: WebGL
          buildMethod: Highfly.CI.WebGLBuilder.Build
          allowDirtyBuild: true

      - name: Verify WebGL output
        shell: bash
        run: |
          set -euxo pipefail
          OUT="LucidHost/3D_game/build/WebGL"
          test -f "$OUT/index.html"
          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          chmod -R u+rwX "$OUT"
          test -w "$OUT"
          touch "$OUT/.nojekyll"

          # donor lab v2.7 cache bust: force mobile browsers to request this exact WebGL payload.
          sed -i 's#/WebGL.loader.js"#/WebGL.loader.js?v=0270"#' "$OUT/index.html"
          sed -i 's#/WebGL.data"#/WebGL.data?v=0270"#' "$OUT/index.html"
          sed -i 's#/WebGL.framework.js"#/WebGL.framework.js?v=0270"#' "$OUT/index.html"
          sed -i 's#/WebGL.wasm"#/WebGL.wasm?v=0270"#' "$OUT/index.html"
          grep -q "v=0270" "$OUT/index.html"

          # Desktop quick-test mode: large 16:9 canvas inside the browser, no fullscreen API required.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("LucidHost/3D_game/build/WebGL/index.html")
          s = p.read_text(encoding="utf-8")
          css = """<style id="highfly-desktop-fit">
          @media (pointer:fine) and (min-width:900px) {
            html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
            #unity-container.unity-desktop {
              position:fixed !important;
              left:50% !important; top:50% !important;
              transform:translate(-50%,-50%) !important;
              width:min(100vw, 177.777777vh) !important;
              height:min(100vh, 56.25vw) !important;
            }
            #unity-canvas { width:100% !important; height:100% !important; }
            #unity-footer { display:none !important; }
          }
          </style>"""
          if "highfly-desktop-fit" not in s:
              s = s.replace("</head>", css + "</head>")
          p.write_text(s, encoding="utf-8")
          PY
          grep -q "highfly-desktop-fit" "$OUT/index.html"

          du -sh "$OUT"
          find "$OUT" -maxdepth 2 -type f | head -n 40

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: LucidHost/3D_game/build/WebGL

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
