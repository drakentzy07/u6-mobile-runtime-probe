          grep -q "public static bool IsActive => true" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflySkillLabBootstrap.cs
          grep -q "DONOR LAB 2.7" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflySkillLabBootstrap.cs
          grep -q "KAYKIT HUNTER CORE" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflySkillLabBootstrap.cs
          grep -q "HighflyDonorBrowserV022.Install(transform)" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflySkillLabBootstrap.cs
          grep -q "DRIFT DE FÓRMULA" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAcceptedGalleryV016.cs
          grep -q "JUMP SMASH" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAcceptedGalleryV016.cs
          grep -q "SigilLungeDistance = 2.5f" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorWeaponRuntimeV021.cs
          grep -q "SigilTraceWindow = 0.35f" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorWeaponRuntimeV021.cs
          grep -q "DragonThrowEventRealSeconds = 0.6666667f / 1.4f" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorWeaponRuntimeV021.cs
          grep -q "DragonRecallFirstLegSpeed = 40f" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorWeaponRuntimeV021.cs
          grep -q "SWORD THROW / EMBED / RECALL" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorBrowserV022.cs
          grep -q "SKILLS +" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorBrowserV022.cs
          grep -q "DANZA GEMELA" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorBrowserV022.cs
          grep -q "PxVortexEdge" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorExpandedRuntimeV022.cs
          grep -q "AshForcePull" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorExpandedRuntimeV022.cs
          grep -q "SubMeteorBreak" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorExpandedRuntimeV022.cs
          grep -q "AdaptiveHyperArmorHeavy" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorExpandedRuntimeV022.cs
          grep -q "HighflyFinalFxV024.SpawnSlash" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyPremiumSkillRuntime.cs
          grep -q "HighflyLabMotionGuardV026" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyPremiumSkillRuntime.cs
          grep -q "SkillOwnsMotion" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAerialMobility.cs
          grep -q "targetHeight = 1.64f" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCharacterCompareV022.cs
          grep -q "HighflyAnimatorMirrorV027" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCharacterCompareV022.cs
          grep -q "HighflyCombatFacingV027" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCharacterCompareV022.cs
          grep -q "KAYKIT HUNTER • LUCID CORE" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCharacterCompareV022.cs
          grep -q "HighflyCombatFacingV027.FaceVisual" LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyPremiumSkillRuntime.cs
