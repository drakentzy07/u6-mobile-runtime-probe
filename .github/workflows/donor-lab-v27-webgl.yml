name: HIGHFLY Run0F Lucid Dragon KayKit 6000.6.2

on:
  workflow_dispatch:
  push:
    branches: [highfly/run0f-lucid-dragon-kaykit-6000.6.2]
    paths:
      - "ci/**"
      - ".github/workflows/donor-lab-v27-webgl.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: run0f-lucid-dragon-kaykit-6000-6-2
  cancel-in-progress: true

jobs:
  build:
    name: Build Run0F • Lucid + Dragon + KayKit • Unity 6000.6.2
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout probe repo
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Download pinned Lucid with Git LFS
        shell: bash
        run: |
          set -euxo pipefail
          git lfs version

          mkdir LucidHost
          git -C LucidHost init
          git -C LucidHost remote add origin https://github.com/DohunWi/3D-Action.git
          git -C LucidHost lfs install --local

          GIT_LFS_SKIP_SMUDGE=1 git -C LucidHost fetch --depth 1 origin da73b5be7ffa7216c48e196c4a69fe3ff66c6c65
          GIT_LFS_SKIP_SMUDGE=1 git -C LucidHost checkout --detach FETCH_HEAD
          git -C LucidHost lfs pull

          test -f LucidHost/3D_game/ProjectSettings/ProjectVersion.txt
          cat LucidHost/3D_game/ProjectSettings/ProjectVersion.txt

          ASSET="LucidHost/3D_game/Assets/FourEvilDragonsPBR/Animations/DragonUsurper/idle01.fbx"
          test -f "$ASSET"
          test "$(stat -c%s "$ASSET")" -gt 100000
          if head -n 1 "$ASSET" | grep -q "git-lfs.github.com"; then
            echo "ERROR: LFS pointer detected instead of real asset"
            exit 1
          fi
          echo "LFS_OK size=$(stat -c%s "$ASSET")"

      - name: Remove Unity AI Assistant incompatible with 6000.6.2
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("LucidHost/3D_game/Packages")
          manifest_path = root / "manifest.json"
          lock_path = root / "packages-lock.json"

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.get("dependencies", {}).pop("com.unity.ai.assistant", None)
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          lock.get("dependencies", {}).pop("com.unity.ai.assistant", None)
          lock_path.write_text(json.dumps(lock, indent=2) + "\n", encoding="utf-8")
          PY

          ! grep -q '"com.unity.ai.assistant"' LucidHost/3D_game/Packages/manifest.json
          ! grep -q '"com.unity.ai.assistant"' LucidHost/3D_game/Packages/packages-lock.json
          echo "UNITY_AI_ASSISTANT_REMOVED=1"

      - name: Install HIGHFLY Mobile Core v0.6 + Donor Lab 2.7 KayKit Hunter Core
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile
          mkdir -p LucidHost/3D_game/Assets/HIGHFLY/Core/Combat
          mkdir -p LucidHost/3D_game/Assets/HIGHFLY/Lab
          mkdir -p LucidHost/3D_game/Assets/HIGHFLY/Parkour
          mkdir -p LucidHost/3D_game/Assets/Resources/HIGHFLY/SkillVFX
          mkdir -p LucidHost/3D_game/Assets/Resources/HIGHFLY/AcceptedVFX
          mkdir -p LucidHost/3D_game/Assets/Resources/HIGHFLY/CharacterCompare
          mkdir -p LucidHost/3D_game/Assets/Resources/HIGHFLY/FinalVFX
          mkdir -p LucidHost/3D_game/Assets/HIGHFLY/ThirdParty
          mkdir -p LucidHost/3D_game/Assets/Plugins/WebGL

          cp ci/mobile/HighflyMobileCore.cs LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyMobileCore.cs
          cp ci/mobile/HighflyMobileText.cs LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyMobileText.cs
          cp ci/mobile/HighflyThirdPersonMobileCamera.cs LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyThirdPersonMobileCamera.cs
          cp ci/combat/HighflyCombatCore.cs LucidHost/3D_game/Assets/HIGHFLY/Core/Combat/HighflyCombatCore.cs
          cp ci/combat/HighflyLucidCombatBridge.cs LucidHost/3D_game/Assets/HIGHFLY/Core/Combat/HighflyLucidCombatBridge.cs
          cp ci/lab/HighflySkillLabBootstrap.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflySkillLabBootstrap.cs
          cp ci/lab/HighflyPremiumSkillRuntime.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyPremiumSkillRuntime.cs
          cp ci/lab/HighflyLabDesktopControls.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyLabDesktopControls.cs
          cp ci/lab/HighflyPremiumFx.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyPremiumFx.cs
          cp ci/lab/HighflyAnimeFx.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAnimeFx.cs
          cp ci/lab/HighflyAdvancedSkillRuntime.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAdvancedSkillRuntime.cs
          cp ci/lab/HighflyReferenceSkillRuntime.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyReferenceSkillRuntime.cs
          cp ci/lab/HighflyAerialMobility.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAerialMobility.cs
          cp ci/lab/HighflySkillLoadoutMenu.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflySkillLoadoutMenu.cs
          cp ci/lab/HighflySkillCooldownUI.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflySkillCooldownUI.cs
          cp ci/lab/HighflyMasterSkillTree.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyMasterSkillTree.cs
          cp ci/lab/HighflySkillBrowser.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflySkillBrowser.cs
          cp ci/lab/HighflyTimeDilationManager.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyTimeDilationManager.cs
          cp ci/lab/HighflyApexPassSkillRuntime.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyApexPassSkillRuntime.cs
          cp ci/lab/HighflyCombatLabV010.Core.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCombatLabV010.Core.cs
          cp ci/lab/HighflyCombatLabV010.DamageMove.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCombatLabV010.DamageMove.cs
          cp ci/lab/HighflyCombatLabV010.ControlShadow.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCombatLabV010.ControlShadow.cs
          cp ci/lab/HighflyCombatLabV010.BuffDefense.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCombatLabV010.BuffDefense.cs
          cp ci/lab/HighflyCombatLabBrowserV010.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCombatLabBrowserV010.cs
          cp ci/lab/HighflyLabTargetsV011.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyLabTargetsV011.cs
          cp ci/lab/HighflyParkourAnimationV010.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyParkourAnimationV010.cs
          cp ci/lab/HighflyAcceptedSkillRuntimeV016.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAcceptedSkillRuntimeV016.cs
          cp ci/lab/HighflyAcceptedGalleryV016.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAcceptedGalleryV016.cs
          cp ci/lab/HighflyDonorWeaponRuntimeV021.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorWeaponRuntimeV021.cs
          cp ci/lab/HighflyDonorExpandedRuntimeV022.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorExpandedRuntimeV022.cs
          cp ci/lab/HighflyDonorBrowserV022.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorBrowserV022.cs
          cp ci/lab/HighflyCharacterCompareV022.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCharacterCompareV022.cs
          cp ci/lab/HighflyFinalFxV024.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyFinalFxV024.cs
          cp ci/lab/HighflyLabMotionGuardV026.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyLabMotionGuardV026.cs
          cp ci/lab/HighflyLabTestHistoryV026.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyLabTestHistoryV026.cs
          cp ci/lab/HighflyCombatFacingV027.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCombatFacingV027.cs
          cp ci/lab/HighflyAnimatorMirrorV027.cs LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAnimatorMirrorV027.cs

          # KayKit Character Pack: Adventurers, official CC0 source pinned for A/B testing.
          KAYKIT="$RUNNER_TEMP/KayKit-Adventurers"
          git clone --filter=blob:none https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0.git "$KAYKIT"
          git -C "$KAYKIT" checkout 672074b73ba276876a19e8816ecdc5241817ab47
          git -C "$KAYKIT" lfs install --local || true
          git -C "$KAYKIT" lfs pull || true
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Characters/fbx/Knight.fbx"              "LucidHost/3D_game/Assets/Resources/HIGHFLY/CharacterCompare/KayKitKnight.fbx"
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Characters/fbx/knight_texture.png"              "LucidHost/3D_game/Assets/Resources/HIGHFLY/CharacterCompare/knight_texture.png"
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Assets/fbx/sword_1handed.fbx"              "LucidHost/3D_game/Assets/Resources/HIGHFLY/CharacterCompare/KayKitSword1H.fbx"
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Assets/fbx/arrow.fbx"                       "LucidHost/3D_game/Assets/Resources/HIGHFLY/FinalVFX/KayKitArrow.fbx"

          # Kenney Particle Pack 1.1 textures: CC0, pinned mirror commit.
          KENNEY_BASE="https://raw.githubusercontent.com/Calinou/kenney-particle-pack/ab7086639ee73be31abd87feb21bf1402d4e8144/addons/kenney_particle_pack"
          for F in slash_01.png slash_02.png slash_03.png slash_04.png spark_04.png magic_03.png circle_05.png twirl_02.png smoke_05.png scorch_01.png; do
            curl -L --fail --retry 3 "$KENNEY_BASE/$F" -o "LucidHost/3D_game/Assets/Resources/HIGHFLY/FinalVFX/$F"
          done
          curl -L --fail --retry 3 "$KENNEY_BASE/LICENSE.txt" -o "LucidHost/3D_game/Assets/HIGHFLY/ThirdParty/KenneyParticlePack_LICENSE.txt"

          # CC0 Quaternius Universal Animation Library 2 v2.1.
          # Pinned public mirror; SHA-256 is verified against the user's Library copy.
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/Magellan36/bunker-game/a3f75bf101c1d454a51bee4e4a77a60a082c0175/assets/models/WIP/FINAL/Universal%20Animation%20Library%202%5BStandard%5D/Universal%20Animation%20Library%202%5BStandard%5D/Unity/UAL2_Standard.fbx" \
            -o LucidHost/3D_game/Assets/HIGHFLY/Parkour/UAL2_Standard.fbx
          echo "d26d0e9f4a202d473194c056045143095a605a53ba1d823ef24055be4b86851d  LucidHost/3D_game/Assets/HIGHFLY/Parkour/UAL2_Standard.fbx" | sha256sum -c -

          cp "LucidHost/3D_game/Assets/UnityTechnologies/ParticlePack/EffectExamples/Legacy Particles/Prefabs/ElectricalSparksEffect.prefab"              "LucidHost/3D_game/Assets/Resources/HIGHFLY/SkillVFX/ElectricalSparks.prefab"
          cp "LucidHost/3D_game/Assets/UnityTechnologies/ParticlePack/EffectExamples/Fire & Explosion Effects/Prefabs/EnergyExplosion.prefab"              "LucidHost/3D_game/Assets/Resources/HIGHFLY/SkillVFX/EnergyExplosion.prefab"
          cp "LucidHost/3D_game/Assets/UnityTechnologies/ParticlePack/EffectExamples/Legacy Particles/Prefabs/PlasmaExplosionEffect.prefab"              "LucidHost/3D_game/Assets/Resources/HIGHFLY/SkillVFX/PlasmaExplosion.prefab"
          cp "LucidHost/3D_game/Assets/UnityTechnologies/ParticlePack/EffectExamples/Legacy Particles/Prefabs/SparksEffect.prefab"              "LucidHost/3D_game/Assets/Resources/HIGHFLY/SkillVFX/Sparks.prefab"
          cp "LucidHost/3D_game/Assets/UnityTechnologies/ParticlePack/EffectExamples/Fire & Explosion Effects/Prefabs/ParticlesLight.prefab"              "LucidHost/3D_game/Assets/Resources/HIGHFLY/SkillVFX/ParticlesLight.prefab"

          cp "LucidHost/3D_game/Assets/UnityTechnologies/ParticlePack/EffectExamples/Magic Effects/Prefabs/EarthShatter.prefab"                          "LucidHost/3D_game/Assets/Resources/HIGHFLY/AcceptedVFX/EarthShatter.prefab"
          cp "LucidHost/3D_game/Assets/UnityTechnologies/ParticlePack/EffectExamples/Fire & Explosion Effects/Prefabs/EnergyExplosion.prefab"             "LucidHost/3D_game/Assets/Resources/HIGHFLY/AcceptedVFX/EnergyExplosion.prefab"
          cp "LucidHost/3D_game/Assets/Mixamo/Knight.prefab"              "LucidHost/3D_game/Assets/Resources/HIGHFLY/SkillVFX/ShadowKnight.prefab"

          cp ci/mobile/HighflyWebGL.jslib LucidHost/3D_game/Assets/Plugins/WebGL/HighflyWebGL.jslib
          cp ci/mobile/InputSystem_Actions.Mobile.inputactions LucidHost/3D_game/Assets/InputSystem_Actions.inputactions

          cp ci/mobile/MainMenuController.Mobile.cs LucidHost/3D_game/Assets/Scripts/Manager/MainMenuController.cs
          cp ci/mobile/DialogueUI.Mobile.cs LucidHost/3D_game/Assets/Scripts/Interaction/DialogueUI.cs
          cp ci/mobile/TutorialUI.Mobile.cs LucidHost/3D_game/Assets/Scripts/Interaction/TutorialUI.cs
          cp ci/mobile/PlayerInteraction.Mobile.cs LucidHost/3D_game/Assets/Scripts/Player/PlayerInteraction.cs
          cp ci/mobile/PlayerController.Mobile.cs LucidHost/3D_game/Assets/Scripts/Player/PlayerController.cs
          cp ci/mobile/PlayerStats.Mobile.cs LucidHost/3D_game/Assets/Scripts/Player/PlayerStats.cs
          cp ci/mobile/PlayerPotion.Mobile.cs LucidHost/3D_game/Assets/Scripts/Player/PlayerPotion.cs

          test -s LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyMobileCore.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyMobileText.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyThirdPersonMobileCamera.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Core/Combat/HighflyCombatCore.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Core/Combat/HighflyLucidCombatBridge.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflySkillLabBootstrap.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyPremiumSkillRuntime.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyLabDesktopControls.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyPremiumFx.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAnimeFx.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAdvancedSkillRuntime.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyReferenceSkillRuntime.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAerialMobility.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflySkillLoadoutMenu.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflySkillCooldownUI.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyMasterSkillTree.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflySkillBrowser.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyTimeDilationManager.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyApexPassSkillRuntime.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCombatLabV010.Core.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCombatLabV010.DamageMove.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCombatLabV010.ControlShadow.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCombatLabV010.BuffDefense.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCombatLabBrowserV010.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyLabTargetsV011.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyParkourAnimationV010.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAcceptedSkillRuntimeV016.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAcceptedGalleryV016.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorWeaponRuntimeV021.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorExpandedRuntimeV022.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyDonorBrowserV022.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCharacterCompareV022.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyFinalFxV024.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyLabMotionGuardV026.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyLabTestHistoryV026.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyCombatFacingV027.cs
          test -s LucidHost/3D_game/Assets/HIGHFLY/Lab/HighflyAnimatorMirrorV027.cs
