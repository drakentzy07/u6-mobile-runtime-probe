          test -s LucidHost/3D_game/Assets/Resources/HIGHFLY/CharacterCompare/KayKitSword1H.fbx
          test -s LucidHost/3D_game/Assets/Resources/HIGHFLY/FinalVFX/KayKitArrow.fbx
