name: HIGHFLY Run0H Lab Shell Warrior Assassin

on:
  workflow_dispatch:
  push:
    branches: [highfly/run0h-lab-shell-warrior-assassin]
    paths:
      - "ci/**"
      - ".github/workflows/run0h-lab-shell.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: highfly-run0h-lab-shell
  cancel-in-progress: true

jobs:
  build:
    name: Build Run0H • Direct Lab + Warrior + Assassin • Unity 6000.6.2
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout probe repo
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Download pinned Lucid with Git LFS
        shell: bash
        run: |
          set -euxo pipefail
          mkdir LucidHost
          git -C LucidHost init
          git -C LucidHost remote add origin https://github.com/DohunWi/3D-Action.git
          git -C LucidHost lfs install --local
          GIT_LFS_SKIP_SMUDGE=1 git -C LucidHost fetch --depth 1 origin da73b5be7ffa7216c48e196c4a69fe3ff66c6c65
          GIT_LFS_SKIP_SMUDGE=1 git -C LucidHost checkout --detach FETCH_HEAD
          git -C LucidHost lfs pull
          test -f LucidHost/3D_game/ProjectSettings/ProjectVersion.txt

      - name: Remove Unity AI Assistant incompatible with 6000.6.2
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("LucidHost/3D_game/Packages")
          for name in ("manifest.json", "packages-lock.json"):
              p = root / name
              data = json.loads(p.read_text(encoding="utf-8"))
              data.get("dependencies", {}).pop("com.unity.ai.assistant", None)
              p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          ! grep -q '"com.unity.ai.assistant"' LucidHost/3D_game/Packages/manifest.json
          ! grep -q '"com.unity.ai.assistant"' LucidHost/3D_game/Packages/packages-lock.json

      - name: Install Run0H lab foundation
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile
          mkdir -p LucidHost/3D_game/Assets/HIGHFLY/Core/Combat
          mkdir -p LucidHost/3D_game/Assets/HIGHFLY/Run0H
          mkdir -p LucidHost/3D_game/Assets/Resources/HIGHFLY/Run0H
          mkdir -p LucidHost/3D_game/Assets/Plugins/WebGL
          mkdir -p LucidHost/3D_game/Assets/Editor

          cp ci/mobile/HighflyMobileCore.cs LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyMobileCore.cs
          cp ci/mobile/HighflyMobileText.cs LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyMobileText.cs
          cp ci/mobile/HighflyThirdPersonMobileCamera.cs LucidHost/3D_game/Assets/HIGHFLY/Core/Mobile/HighflyThirdPersonMobileCamera.cs
          cp ci/combat/HighflyCombatCore.cs LucidHost/3D_game/Assets/HIGHFLY/Core/Combat/HighflyCombatCore.cs
          cp ci/combat/HighflyLucidCombatBridge.cs LucidHost/3D_game/Assets/HIGHFLY/Core/Combat/HighflyLucidCombatBridge.cs

          cp ci/run0h/HighflyRun0HCompat.cs LucidHost/3D_game/Assets/HIGHFLY/Run0H/HighflyRun0HCompat.cs
          cp ci/run0h/HighflyRun0HCharacterVisual.cs LucidHost/3D_game/Assets/HIGHFLY/Run0H/HighflyRun0HCharacterVisual.cs
          cp ci/run0h/HighflyRun0HLabBootstrap.cs LucidHost/3D_game/Assets/HIGHFLY/Run0H/HighflyRun0HLabBootstrap.cs

          cp ci/mobile/MainMenuController.Mobile.cs LucidHost/3D_game/Assets/Scripts/Manager/MainMenuController.cs
          cp ci/mobile/DialogueUI.Mobile.cs LucidHost/3D_game/Assets/Scripts/Interaction/DialogueUI.cs
          cp ci/mobile/TutorialUI.Mobile.cs LucidHost/3D_game/Assets/Scripts/Interaction/TutorialUI.cs
          cp ci/mobile/PlayerInteraction.Mobile.cs LucidHost/3D_game/Assets/Scripts/Player/PlayerInteraction.cs
          cp ci/mobile/PlayerController.Mobile.cs LucidHost/3D_game/Assets/Scripts/Player/PlayerController.cs
          cp ci/mobile/PlayerStats.Mobile.cs LucidHost/3D_game/Assets/Scripts/Player/PlayerStats.cs
          cp ci/mobile/PlayerPotion.Mobile.cs LucidHost/3D_game/Assets/Scripts/Player/PlayerPotion.cs

          cp ci/mobile/HighflyWebGL.jslib LucidHost/3D_game/Assets/Plugins/WebGL/HighflyWebGL.jslib
          cp ci/mobile/InputSystem_Actions.Mobile.inputactions LucidHost/3D_game/Assets/InputSystem_Actions.inputactions

          cp ci/run0h/HighflyRun0HModelImporter.cs LucidHost/3D_game/Assets/Editor/HighflyRun0HModelImporter.cs
          cp ci/run0h/HighflyRun0HWebGLBuilder.cs LucidHost/3D_game/Assets/Editor/HighflyRun0HWebGLBuilder.cs

          KAYKIT="$RUNNER_TEMP/KayKit-Adventurers"
          git clone --filter=blob:none https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0.git "$KAYKIT"
          git -C "$KAYKIT" checkout 672074b73ba276876a19e8816ecdc5241817ab47
          git -C "$KAYKIT" lfs install --local || true
          git -C "$KAYKIT" lfs pull || true

          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Characters/fbx/Knight.fbx"              LucidHost/3D_game/Assets/Resources/HIGHFLY/Run0H/KayKitKnight.fbx
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Characters/fbx/knight_texture.png"              LucidHost/3D_game/Assets/Resources/HIGHFLY/Run0H/knight_texture.png
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Characters/fbx/Rogue.fbx"              LucidHost/3D_game/Assets/Resources/HIGHFLY/Run0H/KayKitRogue.fbx
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Characters/fbx/rogue_texture.png"              LucidHost/3D_game/Assets/Resources/HIGHFLY/Run0H/rogue_texture.png
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Assets/fbx/sword_1handed.fbx"              LucidHost/3D_game/Assets/Resources/HIGHFLY/Run0H/KayKitSword1H.fbx
          cp "$KAYKIT/addons/kaykit_character_pack_adventures/Assets/fbx/dagger.fbx"              LucidHost/3D_game/Assets/Resources/HIGHFLY/Run0H/KayKitDagger.fbx

          test ! -d LucidHost/3D_game/Assets/HIGHFLY/Lab
          grep -q "IsActive => true" LucidHost/3D_game/Assets/HIGHFLY/Run0H/HighflyRun0HCompat.cs
          grep -q "DIRECT BOOT" LucidHost/3D_game/Assets/HIGHFLY/Run0H/HighflyRun0HLabBootstrap.cs
          grep -q "KAYKIT ASSASSIN" LucidHost/3D_game/Assets/HIGHFLY/Run0H/HighflyRun0HCharacterVisual.cs
          grep -q "ForceHideLucidRenderers" LucidHost/3D_game/Assets/HIGHFLY/Run0H/HighflyRun0HCharacterVisual.cs
          echo "RUN0H_LAB_FOUNDATION_INSTALLED=1"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: LucidHost/3D_game/Library
          key: run0h-6000.6.2f1-${{ hashFiles('ci/run0h/**', 'ci/mobile/**', 'ci/combat/**') }}
          restore-keys: |
            run0h-6000.6.2f1-
            run0g-clean-6000.6.2f1-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: LucidHost/3D_game
          unityVersion: 6000.6.2f1
          targetPlatform: WebGL
          buildMethod: Highfly.Run0H.Editor.WebGLBuilder.Build
          allowDirtyBuild: true

      - name: Verify Run0H WebGL
        shell: bash
        run: |
          set -euxo pipefail
          OUT="LucidHost/3D_game/build/WebGL"
          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          chmod -R u+rwX "$OUT"

          test -f "$OUT/index.html"
          test -f "$OUT/RUN0H_BUILD.txt"
          test -d "$OUT/Build"
          test -n "$(find "$OUT/Build" -maxdepth 1 -type f -name '*.wasm' -size +0c -print -quit)"
          test -n "$(find "$OUT/Build" -maxdepth 1 -type f -name '*.framework.js' -size +0c -print -quit)"
          test -z "$(find "$OUT/Build" -maxdepth 1 -type f \( -name '*.gz' -o -name '*.br' \) -print -quit)"
          grep -q "DIRECT LAB" "$OUT/RUN0H_BUILD.txt"
          echo "RUN0H_WEBGL_OK=1"
          du -sh "$OUT"

      - name: Upload Run0H WebGL
        uses: actions/upload-artifact@v4
        with:
          name: highfly-run0h-webgl
          path: LucidHost/3D_game/build/WebGL
          if-no-files-found: error
          retention-days: 7
