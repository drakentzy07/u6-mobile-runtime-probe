name: Secrets Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/secrets-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Unity CI secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          check_secret () {
            if [ -n "$2" ]; then
              echo "$1=PRESENTE"
            else
              echo "$1=FALTA"
            fi
          }

          check_secret UNITY_LICENSE "$UNITY_LICENSE"
          check_secret UNITY_EMAIL "$UNITY_EMAIL"
          check_secret UNITY_PASSWORD "$UNITY_PASSWORD"
          check_secret UNITY_SERIAL "$UNITY_SERIAL"
