name: Donor RAW Sigil Probe

on:
  push:
    branches: [highfly/donor-lab-v2.1-weapon-raw]
    paths:
      - ".github/workflows/donor-raw-sigil.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  raw-sigil:
    name: Execute original Sigil Dash Attack
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout HIGHFLY probe
        uses: actions/checkout@v4

      - name: Assemble isolated Unity 6000.4 RAW donor project
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="$GITHUB_WORKSPACE/RawSigilProject"
          mkdir -p "$PROJECT/Assets" "$PROJECT/Packages" "$PROJECT/ProjectSettings"

          cat > "$PROJECT/ProjectSettings/ProjectVersion.txt" <<'EOF'
          m_EditorVersion: 6000.4.0f1
          EOF

          cat > "$PROJECT/Packages/manifest.json" <<'EOF'
          {
            "dependencies": {
              "com.likeon.gas": "file:com.likeon.gas",
              "com.likeon.gas.movement": "file:com.likeon.gas.movement",
              "com.likeon.gas.combat": "file:com.likeon.gas.combat",
              "com.unity.inputsystem": "1.4.4",
              "com.unity.test-framework": "1.4.6",
              "com.unity.ugui": "2.0.0",
              "com.unity.modules.ai": "1.0.0",
              "com.unity.modules.animation": "1.0.0",
              "com.unity.modules.assetbundle": "1.0.0",
              "com.unity.modules.audio": "1.0.0",
              "com.unity.modules.director": "1.0.0",
              "com.unity.modules.imageconversion": "1.0.0",
              "com.unity.modules.imgui": "1.0.0",
              "com.unity.modules.jsonserialize": "1.0.0",
              "com.unity.modules.particlesystem": "1.0.0",
              "com.unity.modules.physics": "1.0.0",
              "com.unity.modules.physics2d": "1.0.0",
              "com.unity.modules.screencapture": "1.0.0",
              "com.unity.modules.ui": "1.0.0",
              "com.unity.modules.uielements": "1.0.0",
              "com.unity.modules.unitywebrequest": "1.0.0",
              "com.unity.modules.unitywebrequestassetbundle": "1.0.0",
              "com.unity.modules.unitywebrequestaudio": "1.0.0",
              "com.unity.modules.unitywebrequesttexture": "1.0.0",
              "com.unity.modules.unitywebrequestwww": "1.0.0"
            }
          }
          EOF

          git clone --filter=blob:none https://github.com/forestlii/sigil-gas.git "$PROJECT/Packages/com.likeon.gas"
          git -C "$PROJECT/Packages/com.likeon.gas" checkout dfb8e965968eca5a7d9f535d3e892ce4ef4e0b3a

          git clone --filter=blob:none https://github.com/forestlii/sigil-movement.git "$PROJECT/Packages/com.likeon.gas.movement"
          git -C "$PROJECT/Packages/com.likeon.gas.movement" checkout fe54835ac32c39a138de25fec2ae20e56096463c

          git clone --filter=blob:none https://github.com/forestlii/sigil-combat.git "$PROJECT/Packages/com.likeon.gas.combat"
          git -C "$PROJECT/Packages/com.likeon.gas.combat" checkout aeee8dcee73e447f577e64201d651829efe2d5c1

          mkdir -p "$PROJECT/Assets/SigilCombatDemo"
          cp -a "$PROJECT/Packages/com.likeon.gas.combat/Samples~/CombatDemo/." "$PROJECT/Assets/SigilCombatDemo/"

          cat > "$PROJECT/Assets/SigilCombatDemo/Tests/HighflyRawDashAttackSmokeTest.cs" <<'EOF'
          using System.Collections;
          using NUnit.Framework;
          using UnityEngine;
          using UnityEngine.TestTools;
          using Likeon.GAS;

          namespace Likeon.GAS.Sample.CombatDemo.Tests
          {
              public class HighflyRawDashAttackSmokeTest
              {
                  [UnityTest]
                  public IEnumerator HIGHFLY_RAW_DashAttack_ExecutesOriginalInputAbilityTraceChain()
                  {
                      var ground = GameObject.CreatePrimitive(PrimitiveType.Plane);
                      ground.transform.localScale = new Vector3(6f, 1f, 6f);

                      var playerPrefab = Resources.Load<GameObject>("CombatDemoPlayer");
                      var enemyPrefab = Resources.Load<GameObject>("CombatDemoEnemy");
                      Assert.IsNotNull(playerPrefab, "Original CombatDemoPlayer prefab must load.");
                      Assert.IsNotNull(enemyPrefab, "Original CombatDemoEnemy prefab must load.");

                      var player = Object.Instantiate(playerPrefab);
                      player.transform.SetPositionAndRotation(Vector3.zero, Quaternion.identity);

                      var enemy = Object.Instantiate(enemyPrefab);
                      enemy.transform.position = new Vector3(0f, 0f, 3.7f);
                      var enemyAI = enemy.GetComponent<CombatDemoEnemyAI>();
                      if (enemyAI != null) enemyAI.enabled = false;

                      yield return null;
                      yield return null;
                      Physics.SyncTransforms();

                      var asc = player.GetComponent<AbilitySystemComponent>();
                      var input = player.GetComponent<InputSystemComponent>();
                      var mover = player.GetComponent<CharacterMovementSystemComponent>();
                      var enemyAsc = enemy.GetComponent<AbilitySystemComponent>();

                      Assert.IsNotNull(asc);
                      Assert.IsNotNull(input);
                      Assert.IsNotNull(mover);
                      Assert.IsNotNull(enemyAsc);
                      Assert.IsTrue(asc.HasMatchingGameplayTag(CombatDemoTags.Weapon_Melee),
                          "RAW prefab should start with melee weapon equipped.");

                      bool dashActivated = false;
                      asc.OnAbilityActivated += ability =>
                      {
                          if (ability.GetAbilityTags().HasTag(CombatDemoTags.Ability_DashAttack))
                              dashActivated = true;
                      };

                      Vector3 before = player.transform.position;
                      float hpBefore = enemyAsc.GetAttributeValue(
                          GameplayAttribute.From<AS_Health>("Health"));

                      // Original donor route:
                      // sprint input -> Movement.State.Sprint -> attack input polymorphism -> GA_DashAttack.
                      input.ReceiveInput(
                          CombatDemoTags.Input_Sprint,
                          InputTriggerEvent.Started,
                          InputActionData.Empty);
                      yield return null;

                      Assert.IsTrue(asc.HasMatchingGameplayTag(CombatDemoTags.State_Sprint),
                          "Original sprint state tag must gate the dash attack.");

                      input.ReceiveInput(
                          CombatDemoTags.Input_Attack,
                          InputTriggerEvent.Started,
                          InputActionData.Empty);
                      yield return null;
                      Physics.SyncTransforms();

                      float moved = Vector3.Distance(
                          new Vector3(before.x, 0f, before.z),
                          new Vector3(player.transform.position.x, 0f, player.transform.position.z));

                      Assert.IsTrue(dashActivated, "Original GA_DashAttack must activate.");
                      Assert.That(moved, Is.EqualTo(2.5f).Within(0.20f),
                          "Original GA_DashAttack must preserve its 2.5m lunge.");

                      yield return new WaitForSeconds(0.20f);
                      float hpAfter = enemyAsc.GetAttributeValue(
                          GameplayAttribute.From<AS_Health>("Health"));

                      Assert.Less(hpAfter, hpBefore,
                          "Original dash trace must damage the enemy during its donor trace window.");

                      Object.Destroy(player);
                      Object.Destroy(enemy);
                      Object.Destroy(ground);
                      yield return null;
                  }
              }
          }
          EOF

          echo "RAW_SIGIL_COMMIT=aeee8dcee73e447f577e64201d651829efe2d5c1"
          grep -q "public float LungeDistance = 2.5f"             "$PROJECT/Assets/SigilCombatDemo/GA_DashAttack.cs"
          grep -q "public float TraceWindow = 0.35f"             "$PROJECT/Assets/SigilCombatDemo/GA_DashAttack.cs"
          grep -q "TraceEntryIndex = 1"             "$PROJECT/Assets/SigilCombatDemo/GA_DashAttack.cs"

      - name: Run original donor PlayMode smoke test
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: RawSigilProject
          testMode: PlayMode
          artifactsPath: raw-sigil-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: HIGHFLY RAW Sigil Dash

      - name: Upload RAW donor results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-sigil-dash-results
          path: |
            raw-sigil-artifacts
            artifacts
          if-no-files-found: ignore
