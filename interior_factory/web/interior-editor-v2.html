<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HIGHFLY — Interior Editor v2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07090e;color:#eef3fb;font-family:Inter,system-ui,sans-serif}canvas{display:block}
#top{position:fixed;left:10px;right:10px;top:10px;z-index:20;display:flex;gap:7px;align-items:center;pointer-events:auto}
.panel{background:#0b111ddd;border:1px solid #31415a;border-radius:11px;backdrop-filter:blur(10px)}
#brand{padding:8px 11px}.title{font:800 12px ui-monospace;letter-spacing:.08em}.sub{font:10px ui-monospace;color:#95a7c0;margin-top:2px}
button{border:1px solid #465c7d;background:#111a2a;color:#e8eef8;border-radius:8px;padding:7px 9px;font:700 10px ui-monospace;cursor:pointer}
button:hover,button.active{background:#243552;border-color:#7a96c0}.danger{border-color:#7e4450}.ok{border-color:#3e765b}
#tools{display:none;gap:5px;padding:5px}#saveState{margin-left:auto;padding:8px 10px;font:700 10px ui-monospace;color:#86eeb1}
#catalog{position:fixed;right:10px;top:58px;bottom:10px;width:min(430px,42vw);min-width:380px;z-index:18;display:none;flex-direction:column;pointer-events:auto;overflow:hidden}
#catalogHead{padding:9px;border-bottom:1px solid #27364c}.row{display:flex;gap:5px;align-items:center}.grow{flex:1}
input,select{width:100%;background:#0a111d;color:#e9eff8;border:1px solid #344861;border-radius:7px;padding:7px;font:11px ui-monospace}
#filters{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}.chip{padding:5px 7px;font-size:9px}
#cards{padding:10px 12px 14px 10px;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-content:start}
.card{background:#111827;border:1px solid #2e4059;border-radius:9px;overflow:hidden;cursor:pointer;position:relative}.card:hover{border-color:#7894bd}
.thumb{height:112px;background:radial-gradient(circle at 50% 55%,#293246,#111722);display:flex;align-items:center;justify-content:center}.thumb img{max-width:100%;max-height:100%;object-fit:contain}.loadingThumb{font:24px ui-monospace;color:#70829c}
.meta{padding:6px}.name{font:800 10px ui-monospace}.cat{font:9px ui-monospace;color:#8fa2bb;margin-top:2px}.badge{position:absolute;top:5px;left:5px;background:#18243a;border:1px solid #58769f;border-radius:999px;padding:2px 5px;font:8px ui-monospace}
.used{right:5px;left:auto;background:#243421;border-color:#557e4c}
#bottom{position:fixed;left:10px;bottom:10px;z-index:17;display:flex;gap:7px;pointer-events:none}#bottom>*{pointer-events:auto}
#hint{padding:8px 10px;font:10px ui-monospace;color:#aab8ca}.key{color:#fff}
#selection{padding:8px 10px;display:none;min-width:210px}.selname{font:800 10px ui-monospace}.selmeta{font:9px ui-monospace;color:#91a1b7;margin-top:3px}
#modeBadge{padding:8px 10px;font:800 10px ui-monospace}.play{color:#7de9ad}.edit{color:#ffcd72}
#placeBanner{position:fixed;left:50%;top:66px;transform:translateX(-50%);z-index:19;display:none;padding:8px 12px;font:800 10px ui-monospace;pointer-events:none}
#cross{position:fixed;left:50%;top:50%;width:7px;height:7px;border:1px solid #fff9;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:15}
#selection .ctrls{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}#selection .ctrls button{padding:5px 7px;font-size:9px}#io{display:none}#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);z-index:30;padding:8px 11px;font:800 10px ui-monospace;opacity:0;transition:.2s;pointer-events:none}
</style>
</head>
<body>
<div id="top">
  <div id="brand" class="panel"><div class="title">HIGHFLY // INTERIOR EDITOR v2</div><div class="sub">FORJA · IA + EDICIÓN MANUAL · 466+ ASSETS</div></div>
  <button id="modeBtn">EDITAR</button>
  <div id="tools" class="panel">
    <button data-mode="translate" class="active">GIZMO MOVER</button>
    <button id="rotLBtn">ROTAR ↺</button>
    <button id="rotRBtn">ROTAR ↻</button>
    <button id="scaleDownBtn">TAMAÑO ▼</button>
    <button id="scaleUpBtn">TAMAÑO ▲</button>
    <button id="downBtn">Y ↓</button>
    <button id="upBtn">Y ↑</button>
    <button id="dupBtn">DUPLICAR</button>
    <button id="delBtn" class="danger">BORRAR</button>
    <button id="undoBtn">↶</button><button id="redoBtn">↷</button>
    <button id="resetBtn">RESET</button>
    <button id="exportBtn" class="ok">EXPORTAR</button>
    <button id="importBtn">IMPORTAR</button>
  </div>
  <div id="saveState" class="panel">AUTOSAVE ✓</div>
</div>

<aside id="catalog" class="panel">
  <div id="catalogHead">
    <div class="row"><input id="search" class="grow" placeholder="Buscar asset…"><select id="category"><option value="all">Todas</option></select></div>
    <div id="filters"><button class="chip active" data-filter="recommended">RECOMENDADOS</button><button class="chip" data-filter="used">UTILIZADOS</button><button class="chip" data-filter="all">TODOS</button><button class="chip" data-filter="forge">FORJA</button><button class="chip" data-filter="tavern">TABERNA</button></div>
  </div>
  <div id="cards"></div>
</aside>

<div id="bottom">
  <div id="modeBadge" class="panel play">MODO JUGAR</div>
  <div id="hint" class="panel"><span class="key">WASD</span> mover · mouse cámara · <span class="key">Shift</span> correr</div>
  <div id="selection" class="panel"><div class="selname"></div><div class="selmeta"></div><div class="ctrls"><button id="selRotL">↺ 15°</button><button id="selRotR">↻ 15°</button><button id="selScaleDown">− tamaño</button><button id="selScaleUp">+ tamaño</button><button id="selDown">↓ altura</button><button id="selUp">↑ altura</button></div></div>
</div>
<div id="placeBanner" class="panel"></div><div id="toast" class="panel"></div><div id="cross"></div><input id="io" type="file" accept=".json">
