function select(root){selected=root;transform.detach();const box=document.querySelector('#selection');if(!root){box.style.display='none';return}const rec=records.get(root.userData.recordId);if(!rec)return;if(!rec.locked){transform.attach(root)}box.style.display='block';box.querySelector('.selname').textContent=rec.name;const sc=((root.scale.x+root.scale.y+root.scale.z)/3).toFixed(2);box.querySelector('.selmeta').textContent=rec.category+' · '+rec.id+' · escala '+sc+'x'}
renderer.domElement.addEventListener('pointerdown',async e=>{
 if(!editMode||transform.dragging)return;pointerNDC(e);ray.setFromCamera(mouse,camera);
 if(placing){const hit=new THREE.Vector3(),py=(camera.position.y<-.8?LOW:UP),plane=new THREE.Plane(new THREE.Vector3(0,1,0),-py);ray.ray.intersectPlane(plane,hit);pushHistory();const o=await addAsset(placing.key,[hit.x,py,hit.z]);select(o);placing=null;document.querySelector('#placeBanner').style.display='none';saveNow();renderCards();return}
 const hits=ray.intersectObjects(roots,true);select(hits.length?rootOf(hits[0].object):null);
});

function recState(rec){const o=rec.root;return {...rec,pos:o.position.toArray(),rot:[o.rotation.x,o.rotation.y,o.rotation.z],scale:o.scale.toArray(),root:undefined}}
function layout(){return {version:1,scene:'FORJA',savedAt:new Date().toISOString(),objects:[...records.values()].map(recState)}}
let history=[],future=[];
function pushHistory(){history.push(JSON.stringify(layout()));if(history.length>40)history.shift();future.length=0}
async function restore(data){clearEditable();let max=0;for(const rec of data.objects||[]){const n=Number((rec.id||'').split('-').pop());if(n>max)max=n;if(rec.kind==='primitive')primitiveBox({...rec});else if(rec.kind==='asset')await assetObj({...rec})}uid=Math.max(uid,max);select(null);refreshUsed();saveNow(false)}
function scheduleSave(){clearTimeout(dirtyTimer);document.querySelector('#saveState').textContent='GUARDANDO…';dirtyTimer=setTimeout(()=>saveNow(),220)}
function saveNow(toastIt=false){localStorage.setItem(SAVEKEY,JSON.stringify(layout()));document.querySelector('#saveState').textContent='AUTOSAVE ✓';if(toastIt)toast('Guardado')}
async function undo(){if(!history.length)return;future.push(JSON.stringify(layout()));await restore(JSON.parse(history.pop()))}
async function redo(){if(!future.length)return;history.push(JSON.stringify(layout()));await restore(JSON.parse(future.pop()))}

function setEdit(v){editMode=v;document.querySelector('#modeBtn').textContent=v?'JUGAR':'EDITAR';document.querySelector('#tools').style.display=v?'flex':'none';document.querySelector('#catalog').style.display=v?'flex':'none';document.querySelector('#cross').style.display=v?'none':'block';const badge=document.querySelector('#modeBadge');badge.textContent=v?'MODO EDITAR':'MODO JUGAR';badge.className='panel '+(v?'edit':'play');document.querySelector('#hint').innerHTML=v?'<span class="key">OBJETO:</span> WASD mover · WA/WD/SA/SD diagonal · botones ↺↻/tamaño · <span class="key">CÁMARA:</span> sin selección WASD · mouse derecho orbitar · rueda zoom · medio pan':'<span class="key">WASD</span> mover · mouse cámara · <span class="key">Shift</span> correr';if(v){play.unlock();orbit.enabled=true;orbit.target.copy(camera.position).add(new THREE.Vector3(0,0,-4));transform.enabled=true}else{orbit.enabled=false;transform.enabled=false;transform.detach();select(null)}}
document.querySelector('#modeBtn').onclick=()=>setEdit(!editMode);
document.querySelectorAll('#tools [data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tools [data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');transform.setMode('translate')});
document.querySelector('#dupBtn').onclick=()=>duplicate();
document.querySelector('#delBtn').onclick=()=>delSelected();
document.querySelector('#undoBtn').onclick=undo;document.querySelector('#redoBtn').onclick=redo;
document.querySelector('#resetBtn').onclick=async()=>{if(confirm('¿Restaurar la Forja base?')){localStorage.removeItem(SAVEKEY);location.reload()}};
document.querySelector('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(layout(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='HIGHFLY_FORJA_LAYOUT.json';a.click();URL.revokeObjectURL(a.href);toast('Layout exportado')};
const io=document.querySelector('#io');document.querySelector('#importBtn').onclick=()=>io.click();io.onchange=async()=>{const f=io.files[0];if(!f)return;pushHistory();await restore(JSON.parse(await f.text()));toast('Layout importado')};

function syncSelectionLabel(){if(selected)select(selected)}
function rotateSelected(dir){if(!selected)return;const rec=records.get(selected.userData.recordId);if(rec?.locked)return;pushHistory();const step=Math.PI/12;selected.rotation.y=Math.round((selected.rotation.y+dir*step)/step)*step;saveNow();syncSelectionLabel()}
function scaleSelected(dir){if(!selected)return;const rec=records.get(selected.userData.recordId);if(rec?.locked)return;pushHistory();const cur=(selected.scale.x+selected.scale.y+selected.scale.z)/3;const next=THREE.MathUtils.clamp(Math.round((cur+dir*.05)*20)/20,.35,3);const factor=next/cur;selected.scale.multiplyScalar(factor);saveNow();syncSelectionLabel()}
function heightSelected(dir){if(!selected)return;const rec=records.get(selected.userData.recordId);if(rec?.locked)return;pushHistory();selected.position.y+=dir*.10;saveNow();syncSelectionLabel()}
for(const [id,fn] of [['rotLBtn',()=>rotateSelected(-1)],['rotRBtn',()=>rotateSelected(1)],['scaleDownBtn',()=>scaleSelected(-1)],['scaleUpBtn',()=>scaleSelected(1)],['downBtn',()=>heightSelected(-1)],['upBtn',()=>heightSelected(1)],['selRotL',()=>rotateSelected(-1)],['selRotR',()=>rotateSelected(1)],['selScaleDown',()=>scaleSelected(-1)],['selScaleUp',()=>scaleSelected(1)],['selDown',()=>heightSelected(-1)],['selUp',()=>heightSelected(1)]])document.querySelector('#'+id).onclick=fn;

async function duplicate(){if(!selected)return;const rec=records.get(selected.userData.recordId);if(!rec||rec.locked)return;pushHistory();let nr={...rec,id:id(rec.kind==='asset'?'a':'p'),pos:[selected.position.x+.6,selected.position.y,selected.position.z+.6],rot:[selected.rotation.x,selected.rotation.y,selected.rotation.z],scale:selected.scale.toArray(),root:undefined};const o=nr.kind==='asset'?await assetObj(nr):primitiveBox(nr);select(o);saveNow();refreshUsed()}
function delSelected(){if(!selected)return;const rec=records.get(selected.userData.recordId);if(rec?.locked)return;pushHistory();removeRoot(selected);saveNow();refreshUsed()}
addEventListener('keydown',async e=>{
 if(editMode){
  if(['INPUT','SELECT'].includes(document.activeElement?.tagName))return;
  if(e.code==='Delete'||e.code==='Backspace')delSelected();
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyC'&&selected){clipboard=recState(records.get(selected.userData.recordId));toast('Copiado')}
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyV'&&clipboard){pushHistory();let r={...clipboard,id:id(clipboard.kind==='asset'?'a':'p'),pos:[clipboard.pos[0]+.6,clipboard.pos[1],clipboard.pos[2]+.6]};const o=r.kind==='asset'?await assetObj(r):primitiveBox(r);select(o);saveNow();refreshUsed()}
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'){e.preventDefault();e.shiftKey?redo():undo()}
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyY'){e.preventDefault();redo()}
  if(e.code==='Escape'&&placing){placing=null;document.querySelector('#placeBanner').style.display='none'}
 }
});

let filter='recommended',visibleList=[],renderedCount=0;
const cats=[...new Set(CATALOG.map(a=>a.category))].sort(),sel=document.querySelector('#category'),packSel=document.querySelector('#packFilter');
for(const c of cats){const o=document.createElement('option');o.value=c;o.textContent=c;sel.append(o)}
for(const p of [...new Set(CATALOG.map(a=>a.pack))].sort()){const o=document.createElement('option');o.value=p;o.textContent=p;packSel.append(o)}
document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;renderCards()});
document.querySelector('#search').oninput=renderCards;sel.onchange=renderCards;packSel.onchange=renderCards;
function usedKeys(){return new Set([...records.values()].filter(r=>r.kind==='asset').map(r=>r.asset))}
function refreshUsed(){renderCards()}
function computeVisible(){
 const q=document.querySelector('#search').value.toLowerCase(),cat=sel.value,pack=packSel.value,used=usedKeys();
 let list=CATALOG.filter(a=>(!q||a.name.toLowerCase().includes(q)||a.category.toLowerCase().includes(q)||(a.pack||'').toLowerCase().includes(q))&&(cat==='all'||a.category===cat)&&(pack==='all'||a.pack===pack));
 if(filter==='recommended')list=list.filter(a=>a.tags.includes('forge'));
 else if(filter==='used')list=list.filter(a=>used.has(a.key));
 else if(filter==='forge'||filter==='tavern')list=list.filter(a=>a.tags.includes(filter));
 return {list,used};
}
function renderCards(){
 const cards=document.querySelector('#cards');cards.innerHTML='';renderedCount=0;
 const r=computeVisible();visibleList=r.list;cards._used=r.used;
 appendBatch();
 cards.scrollTop=0;
}
function appendBatch(){
 const cards=document.querySelector('#cards');if(renderedCount>=visibleList.length){updateCount();return}
 const used=cards._used||usedKeys(),end=Math.min(renderedCount+12,visibleList.length);
 for(let i=renderedCount;i<end;i++){
   const a=visibleList[i],d=document.createElement('div');d.className='card';
   d.innerHTML='<span class="badge">'+(a.tags.includes('forge')?'RECOM.':'ASSET')+'</span>'+(used.has(a.key)?'<span class="badge used">USADO</span>':'')+'<div class="thumb"><span class="loadingThumb">CARGANDO PREVIEW…</span></div><div class="meta"><div class="name">'+a.name+'</div><div class="cat">'+a.category+'</div><div class="packline">'+a.pack+'</div></div>';
   d.onclick=()=>{placing=a;const b=document.querySelector('#placeBanner');b.textContent='COLOCAR: '+a.name+' · '+a.pack+' · click en el piso · ESC cancela';b.style.display='block'};
   cards.append(d);makeThumb(a,d.querySelector('.thumb'));
 }
 renderedCount=end;updateCount();
}
function updateCount(){document.querySelector('#catalogCount').textContent=renderedCount+' / '+visibleList.length}
document.querySelector('#cards').addEventListener('scroll',e=>{const el=e.currentTarget;if(el.scrollTop+el.clientHeight>el.scrollHeight-360)appendBatch()});
const thumbRenderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});thumbRenderer.setSize(260,165);thumbRenderer.setPixelRatio(1);
const thumbScene=new THREE.Scene();thumbScene.add(new THREE.HemisphereLight(0xffffff,0x303030,2));const thumbCam=new THREE.PerspectiveCamera(35,260/165,.01,50);thumbCam.position.set(2.5,1.8,3);thumbCam.lookAt(0,.7,0);
const thumbQueue=[];let thumbWorkers=0;const MAX_THUMB_WORKERS=4;
function makeThumb(a,host){thumbQueue.push({a,host});pumpThumbs()}
async function pumpThumbs(){
 while(thumbWorkers<MAX_THUMB_WORKERS&&thumbQueue.length){
  const job=thumbQueue.shift();thumbWorkers++;renderThumb(job).finally(()=>{thumbWorkers--;pumpThumbs()});
 }
}
async function renderThumb({a,host}){
 try{
  let src=cache.get(a.key);
  if(!src){
   src=Promise.race([
    loader.loadAsync(a.url).then(g=>g.scene),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('thumb timeout')),10000))
   ]);
   cache.set(a.key,src);
  }
  const base=await src,clone=base.clone(true);
  clone.traverse(n=>{if(n.isMesh){n.castShadow=false;n.receiveShadow=false}});
  let b=new THREE.Box3().setFromObject(clone),sz=b.getSize(new THREE.Vector3()),mx=Math.max(sz.x,sz.y,sz.z)||1;
  clone.scale.multiplyScalar(1.65/mx);
  b=new THREE.Box3().setFromObject(clone);const c=b.getCenter(new THREE.Vector3());
  clone.position.set(-c.x,-b.min.y,-c.z);
  const bs=new THREE.Box3().setFromObject(clone),ss=bs.getSize(new THREE.Vector3()),cc=bs.getCenter(new THREE.Vector3());
  thumbScene.add(clone);
  const radius=Math.max(ss.x,ss.y,ss.z)*.72;
  thumbCam.position.set(radius*1.5,Math.max(.8,ss.y*.85),radius*2.1);
  thumbCam.lookAt(0,Math.max(.45,ss.y*.5),0);
  thumbCam.near=.01;thumbCam.far=Math.max(20,radius*10);thumbCam.updateProjectionMatrix();
  thumbRenderer.render(thumbScene,thumbCam);
  const im=document.createElement('img');im.alt=a.name;im.src=thumbRenderer.domElement.toDataURL('image/png');
  host.innerHTML='';host.append(im);thumbScene.remove(clone);
 }catch(e){
  console.warn('thumb failed',a?.name,a?.url,e);
  host.innerHTML='<span class="loadingThumb">PREVIEW NO CARGÓ<br>'+a.name+'<br><small>'+a.pack+'</small></span>';
 }
}
const toastEl=document.querySelector('#toast');function toast(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.style.opacity=0,1300)}

const keys={};let editMoveHistoryOpen=false;
addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target?.tagName))return;keys[e.code]=1;if(editMode&&selected&&['KeyW','KeyA','KeyS','KeyD'].includes(e.code)&&!editMoveHistoryOpen){const rec=records.get(selected.userData.recordId);if(!rec?.locked){pushHistory();editMoveHistoryOpen=true}}});
addEventListener('keyup',e=>{keys[e.code]=0;if(editMode&&editMoveHistoryOpen&&!keys.KeyW&&!keys.KeyA&&!keys.KeyS&&!keys.KeyD){editMoveHistoryOpen=false;saveNow();syncSelectionLabel()}});renderer.domElement.addEventListener('click',()=>{if(!editMode)play.lock()});
let last=performance.now(),level='UPPER';
function stairY(x,z){if(x<10.8||x>13.5||z<4.0||z>9.3)return null;const t=THREE.MathUtils.clamp((9.2-z)/5,0,1);return 1.65-4*t}
const _fwd=new THREE.Vector3(),_right=new THREE.Vector3(),_move=new THREE.Vector3(),_up=new THREE.Vector3(0,1,0);
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
 if(editMode){
  orbit.update();
  const x=(keys.KeyD?1:0)-(keys.KeyA?1:0),z=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  if(x||z){
   camera.getWorldDirection(_fwd);_fwd.y=0;if(_fwd.lengthSq()<.001)_fwd.set(0,0,-1);_fwd.normalize();_right.crossVectors(_fwd,_up).normalize();_move.set(0,0,0).addScaledVector(_right,x).addScaledVector(_fwd,z).normalize();
   const fine=keys.AltLeft||keys.AltRight,fast=keys.ShiftLeft||keys.ShiftRight;
   const rec=selected?records.get(selected.userData.recordId):null;
   if(selected&&!rec?.locked){
    const speed=fine ? .18 : (fast ? 1.55 : .62);selected.position.addScaledVector(_move,speed*dt);scheduleSave();
   }else{
    const speed=fine ? .45 : (fast ? 4.2 : 1.65),delta=_move.multiplyScalar(speed*dt);camera.position.add(delta);orbit.target.add(delta);
   }
  }
 }else if(play.isLocked){
  let x=(keys.KeyD?1:0)-(keys.KeyA?1:0),z=(keys.KeyW?1:0)-(keys.KeyS?1:0),l=Math.hypot(x,z)||1,sp=(keys.ShiftLeft||keys.ShiftRight)?4.8:2.9;play.moveRight(x/l*sp*dt);play.moveForward(z/l*sp*dt);camera.position.x=THREE.MathUtils.clamp(camera.position.x,.4,13.6);camera.position.z=THREE.MathUtils.clamp(camera.position.z,.4,11.6);const sy=stairY(camera.position.x,camera.position.z);if(sy!==null){camera.position.y=sy;if(camera.position.z<4.3)level='LOWER';if(camera.position.z>9.0)level='UPPER'}else camera.position.y=level==='UPPER'?1.65:LOW+1.65
 }
 renderer.render(scene,camera)
}
requestAnimationFrame(loop);

async function init(){baseArchitecture();await baseProps();const saved=localStorage.getItem(SAVEKEY);if(saved){try{await restore(JSON.parse(saved));toast('Layout recuperado')}catch(e){console.warn(e)}}renderCards();saveNow(false)}
init();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
