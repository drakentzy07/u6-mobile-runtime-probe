<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0a0710"><title>HIGHFLY MU-0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;overflow:hidden;background:#09070d;color:#fff;font-family:system-ui;touch-action:none}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;inset:0;pointer-events:none}.card{background:#0b0811d9;border:1px solid #ffffff22;border-radius:12px;padding:8px 10px}.top{position:absolute;top:10px;left:10px;font-size:12px}.q{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;font-size:12px}.bar{width:190px;height:7px;background:#29232f;border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:#de5267}.bar.m i{background:#6378e8}.bar.x i{background:#a16bd1}.joy{pointer-events:auto;position:absolute;left:18px;bottom:18px;width:118px;height:118px;border:2px solid #ffffff36;border-radius:50%;background:#8d63a51c}.stick{position:absolute;left:35px;top:35px;width:48px;height:48px;border-radius:50%;background:#dcc6eeaa}.actions{pointer-events:auto;position:absolute;right:18px;bottom:18px;display:grid;grid-template-columns:60px 60px 78px;gap:9px;align-items:end}.b{width:60px;height:60px;border-radius:50%;border:1px solid #ffffff3a;background:#231a30e8;color:white;font-weight:800}.atk{width:78px;height:78px;background:#61243ae8}.sk{background:#3c3378e8}.bag{display:none;pointer-events:auto;position:absolute;inset:8%;background:#0b0811f5;border:1px solid #c596ef55;border-radius:16px;padding:16px;overflow:auto;touch-action:pan-y}.bag.open{display:block}.item{display:block;width:100%;margin:7px 0;padding:10px;border-radius:10px;border:1px solid #ffffff24;background:#1a1421;color:white;text-align:left}.item.on{border-color:#c78fff}.toast{position:absolute;top:20%;left:50%;transform:translateX(-50%);opacity:0;background:#0b0811ef;border:1px solid #c78fff55;border-radius:20px;padding:8px 12px;font-size:12px}.toast.on{opacity:1}.rotate{display:none;position:fixed;inset:0;background:#09070d;z-index:5;align-items:center;justify-content:center;text-align:center;padding:20px}@media(orientation:portrait){.rotate{display:flex}}
</style></head><body>
<canvas id="c"></canvas><div class="hud">
<div class="top card"><b>HIGHFLY · HUNTER <span id="lv">LV 1</span></b><div id="st">HP 100/100 · ATK 8 · DEF 1 · 0 oro</div><div class="bar"><i id="hp"></i></div><div class="bar m"><i id="mp"></i></div><div class="bar x"><i id="xp"></i></div></div>
<div class="q card"><b>CONTRATO MU-0</b><div id="qt">Eliminá 5 criaturas · 0/5</div><small id="zn">Ciudad Refugio · segura</small></div>
<div class="toast" id="toast"></div>
<div class="joy" id="joy"><div class="stick" id="stick"></div></div>
<div class="actions"><button class="b" id="pot">Poción<br><small id="pc">x2</small></button><button class="b sk" id="skill">Giro<br><small id="sc">LISTO</small></button><button class="b atk" id="attack">ATACAR</button><button class="b" id="dash">Dash</button><button class="b" id="bagb">Bolsa</button></div>
<section class="bag" id="bag"><button class="item" id="close">Cerrar</button><h3>Inventario MU-0</h3><div id="bs"></div><div id="inv"></div></section></div>
<div class="rotate"><div><h2>Giralo a horizontal 👾</h2>MU-0 está diseñado para Android landscape.</div></div>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x),c=$('c'),g=c.getContext('2d'),world={w:1800,h:1100,s:{x:60,y:60,w:410,h:360}};let W,H,D=1,last=performance.now(),jx=0,jy=0,jid=null,tid=0,saveT=0,combo=0,comboT=0;const key=new Set(),en=[],drop=[],fx=[];const G={blade:{n:'Espada del Caminante',slot:'w',atk:3,d:'+3 ATK'},dagger:{n:'Dagas Umbrías',slot:'w',atk:5,d:'+5 ATK'},armor:{n:'Coraza de Cuero',slot:'a',def:2,d:'+2 DEF'},boots:{n:'Botas del Hunter',slot:'b',spd:25,d:'+25 velocidad'}};const base=()=>({x:330,y:260,hp:100,mh:100,mp:60,mm:60,lv:1,xp:0,nx:100,gold:0,atk:8,def:1,spd:175,pot:2,kills:0,inv:[],eq:{w:null,a:null,b:null},ac:0,sc:0,dc:0});let p=load();
function load(){try{return Object.assign(base(),JSON.parse(localStorage.getItem('hf_mu0')||'{}'))}catch{return base()}}function save(){try{localStorage.setItem('hf_mu0',JSON.stringify(p))}catch{}}
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function atk(){return p.atk+(p.eq.w?G[p.eq.w].atk||0:0)}function def(){return p.def+(p.eq.a?G[p.eq.a].def||0:0)}function spd(){return p.spd+(p.eq.b?G[p.eq.b].spd||0:0)}function safe(){let s=world.s;return p.x>s.x&&p.x<s.x+s.w&&p.y>s.y&&p.y<s.y+s.h}
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');tid=1.6}function spawn(t){let T={g:{n:'Goblin',hp:34,a:6,s:72,x:22,r:15},w:{n:'Lobo',hp:28,a:7,s:102,x:24,r:13},k:{n:'Esqueleto',hp:46,a:9,s:64,x:32,r:16}}[t],x=610+Math.random()*1100,y=80+Math.random()*940;en.push({t,x,y,hp:T.hp,mh:T.hp,a:T.a,s:T.s,xp:T.x,r:T.r,n:T.n,cd:0,dead:0,fl:0})}for(let i=0;i<11;i++)spawn(i%3===0?'k':i%2?'w':'g');
function near(r=1e9){let b=null,d=r;for(let e of en)if(!e.dead){let q=Math.hypot(e.x-p.x,e.y-p.y);if(q<d){d=q;b=e}}return b}
function dmg(e,v){if(!e||e.dead)return;e.hp-=v;e.fl=.12;fx.push({x:e.x,y:e.y,t:.4,txt:'-'+v});if(e.hp<=0){e.dead=2.2;p.kills++;gain(e.xp);p.gold+=5+Math.floor(Math.random()*8);drop.push({x:e.x,y:e.y,t:'gold',v:5+Math.floor(Math.random()*8)});if(Math.random()<.25)drop.push({x:e.x+12,y:e.y,t:'pot'});if(Math.random()<.18){let ids=Object.keys(G);drop.push({x:e.x-12,y:e.y,t:'gear',id:ids[Math.random()*ids.length|0]})}toast(e.n+' derrotado · +'+e.xp+' EXP')}}
function gain(v){p.xp+=v;while(p.xp>=p.nx){p.xp-=p.nx;p.lv++;p.nx=Math.round(p.nx*1.28);p.mh+=15;p.hp=p.mh;p.mm+=5;p.mp=p.mm;p.atk++;toast('¡NIVEL '+p.lv+'!')}}
function attack(){if(p.ac>0)return;p.ac=.32;combo=performance.now()/1000<comboT?combo%3+1:1;comboT=performance.now()/1000+.85;fx.push({x:p.x,y:p.y,t:.2,arc:combo});let e=near(82);if(e)dmg(e,atk()+combo*2)}
function skill(){if(p.sc>0||p.mp<15)return;p.mp-=15;p.sc=5;fx.push({x:p.x,y:p.y,t:.5,spin:1});let n=0;for(let e of en)if(!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<125){dmg(e,Math.round(atk()*1.65));n++}toast('Giro · '+n+' impactos')}
function dash(){if(p.dc>0)return;let x=jx,y=jy;if(!x&&!y){let e=near(260);if(e){x=e.x-p.x;y=e.y-p.y}else x=1}let m=Math.hypot(x,y)||1;p.x=Math.max(20,Math.min(world.w-20,p.x+x/m*130));p.y=Math.max(20,Math.min(world.h-20,p.y+y/m*130));p.dc=2.2}
function pot(){if(!p.pot||p.hp>=p.mh)return;p.pot--;p.hp=Math.min(p.mh,p.hp+55);toast('Poción · +55 HP')}
function pick(){for(let i=drop.length-1;i>=0;i--){let d=drop[i];if(Math.hypot(d.x-p.x,d.y-p.y)>38)continue;if(d.t==='gold'){p.gold+=d.v;toast('+'+d.v+' oro')}else if(d.t==='pot'){p.pot++;toast('+1 poción')}else{if(!p.inv.includes(d.id))p.inv.push(d.id);toast('Loot: '+G[d.id].n)}drop.splice(i,1);inv()}}
function inv(){let e=$('inv');e.innerHTML='';$('bs').textContent='ATK '+atk()+' · DEF '+def()+' · Vel '+spd()+' · '+p.gold+' oro';if(!p.inv.length)e.innerHTML='<small>Salí a cazar para conseguir equipo.</small>';for(let id of p.inv){let q=document.createElement('button'),z=G[id];q.className='item'+(p.eq[z.slot]===id?' on':'');q.innerHTML='<b>'+z.n+'</b><br><small>'+z.d+'</small>';q.onclick=()=>{p.eq[z.slot]=id;inv();save();toast(z.n+' equipado')};e.appendChild(q)}}
function bag(v){$('bag').classList.toggle('open',v===undefined?!$('bag').classList.contains('open'):v);inv()}
$('attack').onpointerdown=attack;$('skill').onpointerdown=skill;$('dash').onpointerdown=dash;$('pot').onpointerdown=pot;$('bagb').onclick=()=>bag();$('close').onclick=()=>bag(false);
let joy=$('joy'),stick=$('stick');function jm(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.hypot(x,y),mx=r.width*.31;if(m>mx){x=x/m*mx;y=y/m*mx}jx=x/mx;jy=y/mx;stick.style.transform='translate('+x+'px,'+y+'px)'}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===jid)jm(e)};joy.onpointerup=joy.onpointercancel=e=>{if(e.pointerId!==jid)return;jid=null;jx=jy=0;stick.style.transform='translate(0,0)'};
addEventListener('keydown',e=>{key.add(e.code);if(e.code==='Space'){e.preventDefault();attack()}if(e.code==='KeyQ')skill();if(e.code==='KeyE')pot();if(e.code==='KeyI')bag()});addEventListener('keyup',e=>key.delete(e.code));
function upd(dt){let x=jx,y=jy;if(key.has('KeyA')||key.has('ArrowLeft'))x--;if(key.has('KeyD')||key.has('ArrowRight'))x++;if(key.has('KeyW')||key.has('ArrowUp'))y--;if(key.has('KeyS')||key.has('ArrowDown'))y++;let m=Math.hypot(x,y);if(m>1){x/=m;y/=m}p.x=Math.max(18,Math.min(world.w-18,p.x+x*spd()*dt));p.y=Math.max(18,Math.min(world.h-18,p.y+y*spd()*dt));p.ac=Math.max(0,p.ac-dt);p.sc=Math.max(0,p.sc-dt);p.dc=Math.max(0,p.dc-dt);p.mp=Math.min(p.mm,p.mp+5*dt);pick();for(let e of en){if(e.dead){e.dead-=dt;if(e.dead<=0){e.dead=0;e.hp=e.mh;e.x=650+Math.random()*1050;e.y=90+Math.random()*920}continue}e.fl=Math.max(0,e.fl-dt);e.cd=Math.max(0,e.cd-dt);if(safe())continue;let x=p.x-e.x,y=p.y-e.y,d=Math.hypot(x,y);if(d<285&&d>28){e.x+=x/d*e.s*dt;e.y+=y/d*e.s*dt}if(d<34&&e.cd<=0){e.cd=.9;p.hp-=Math.max(1,e.a-def());if(p.hp<=0){p.hp=p.mh;p.mp=p.mm;p.x=330;p.y=260;p.gold=Math.max(0,p.gold-20);toast('Caíste · regreso a ciudad')}}}for(let i=fx.length-1;i>=0;i--){fx[i].t-=dt;if(fx[i].t<=0)fx.splice(i,1)}if(tid>0){tid-=dt;if(tid<=0)$('toast').classList.remove('on')}if((saveT+=dt)>4){saveT=0;save()}}
function draw(cx,cy){g.fillStyle='#192218';g.fillRect(0,0,W,H);g.save();g.translate(-cx,-cy);g.fillStyle='#192218';g.fillRect(0,0,world.w,world.h);let s=world.s;g.fillStyle='#3b3740';g.fillRect(s.x,s.y,s.w,s.h);g.strokeStyle='#77717c';g.lineWidth=7;g.strokeRect(s.x,s.y,s.w,s.h);g.fillStyle='#8c7b62';g.fillRect(470,245,110,90);g.fillStyle='#2a272c';g.fillRect(560,285,900,52);for(let i=0;i<30;i++){let x=610+(i*137)%1120,y=80+(i*83)%940;g.fillStyle='#25442d';g.beginPath();g.arc(x,y,20,0,7);g.fill()}g.fillStyle='#9c8a68';g.font='bold 15px system-ui';g.fillText('CIUDAD REFUGIO',110,105);g.fillText('CAMPO DE CAZA',680,165);for(let d of drop){g.fillStyle=d.t==='gold'?'#e6c85e':d.t==='pot'?'#6bd47f':'#bb78ed';g.beginPath();g.arc(d.x,d.y,8,0,7);g.fill()}for(let e of en){if(e.dead)continue;g.save();g.translate(e.x,e.y);g.fillStyle=e.fl?'#fff':e.t==='g'?'#6ca653':e.t==='w'?'#7e8892':'#d8d1bc';g.beginPath();g.arc(0,0,e.r,0,7);g.fill();g.fillStyle='#18151b';g.fillRect(-20,-e.r-12,40,5);g.fillStyle='#d34b5d';g.fillRect(-20,-e.r-12,40*e.hp/e.mh,5);g.fillStyle='#eee';g.font='10px system-ui';g.textAlign='center';g.fillText(e.n,0,-e.r-17);g.restore()}g.save();g.translate(p.x,p.y);g.fillStyle='#d9caec';g.beginPath();g.moveTo(0,-18);g.lineTo(14,12);g.lineTo(-14,12);g.closePath();g.fill();g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.moveTo(10,-5);g.lineTo(27,-20);g.stroke();g.restore();for(let f of fx){if(f.txt){g.fillStyle='#fff';g.font='bold 17px system-ui';g.fillText(f.txt,f.x,f.y-28)}else if(f.spin){g.strokeStyle='#c77fff';g.lineWidth=7;g.beginPath();g.arc(f.x,f.y,110,0,7);g.stroke()}else{g.strokeStyle='#ffd4e8';g.lineWidth=5;g.beginPath();g.arc(f.x,f.y,45+f.arc*7,-1.1,1.1);g.stroke()}}g.restore()}
function hud(){let hp=Math.max(0,p.hp);$('lv').textContent='LV '+p.lv;$('st').textContent='HP '+Math.round(hp)+'/'+p.mh+' · ATK '+atk()+' · DEF '+def()+' · '+p.gold+' oro';$('hp').style.width=100*hp/p.mh+'%';$('mp').style.width=100*p.mp/p.mm+'%';$('xp').style.width=100*p.xp/p.nx+'%';$('qt').textContent=p.kills>=5?'Contrato completado · seguí mejorando equipo':'Eliminá 5 criaturas · '+Math.min(5,p.kills)+'/5';$('zn').textContent=safe()?'Ciudad Refugio · segura':'Campo abierto · hostil';$('pc').textContent='x'+p.pot;$('sc').textContent=p.sc? p.sc.toFixed(1)+'s':'LISTO'}
function loop(n){let dt=Math.min(.033,(n-last)/1000);last=n;if(!$('bag').classList.contains('open'))upd(dt);let cx=Math.max(0,Math.min(world.w-W,p.x-W/2)),cy=Math.max(0,Math.min(world.h-H,p.y-H/2));draw(cx,cy);hud();requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('pagehide',save);inv();
})();
</script></body></html>
